<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YÖKDİL Master – Kişisel Kelime Öğrenme & Akıllı Tekrar</title>
  <meta name="description" content="Kişisel YÖKDİL İngilizce Kelime Öğrenme, Okuma Analizi ve Aralıklı Tekrar (SRS) Uygulaması" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            academic: {
              50: '#f0f5fa', 100: '#e1ecf5', 500: '#3f85be', 600: '#2d6ba2', 700: '#265684', 900: '#1b3854'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Harici Kütüphaneler -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- PDF (pdf.js) ve Word (.docx, mammoth) dosyalarından metin okuma -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <!-- Resimdeki yazıları okuma (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <!-- Bulut senkronizasyonu (Firebase Authentication + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <style>
    body { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    ::selection { background-color: rgba(59, 130, 246, 0.3); color: #93c5fd; }
    .safe-area-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans select-text overflow-hidden">
  <div id="root">
    <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#0f172a;color:#94a3b8;font-family:sans-serif;text-align:center;padding:20px;">
      <div>
        <div style="width:48px;height:48px;border:4px solid #3b82f6;border-top-color:transparent;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite;"></div>
        <h2 style="color:#ffffff;font-size:18px;font-weight:700;margin-bottom:8px;">YÖKDİL Master Yükleniyor...</h2>
        <p style="font-size:12px;color:#64748b;">Kişisel çalışma masanız hazırlanıyor.</p>
      </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- React 18, ReactDOM 18 & Babel Standalone (Cloudflare CDN - Türkiye'de yüksek hızlı ve kesintisiz) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin="anonymous"></script>
  <!-- Fallback CDN (jsdelivr) if Cloudflare is blocked by local network -->
  <script>
    if (!window.React) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"><\/script>');
    }
  </script>

  <!-- Standalone Browser App -->
  <script type="text/babel">
/*@@APP_KODU@@*/
  </script>
</body>
</html>
