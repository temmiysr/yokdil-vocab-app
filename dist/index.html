          {/* Okuma Parçası Yükleme Modalı */}
          {isUploadReadingOpen && (
            <UploadModal
              weeks={weeks}
              onClose={() => setIsUploadReadingOpen(false)}
              onSave={(saved) => {
                const list = Array.isArray(saved) ? saved : [saved];
                setReadings([...list, ...readings]);
                setIsUploadReadingOpen(false);
                // Tek metin kaydedildiyse onu aç, birden çok ise listeyi göster
                setSelectedReadingId(list.length === 1 ? list[0].id : null);
                setActiveTab('readings');
              }}
            />
          )}

          {/* Çıkmış Sınav / Deneme Yükleme Modalı */}
          {isUploadExamOpen && (
            <UploadExamModal
              onClose={() => setIsUploadExamOpen(false)}
              onSave={(newExam) => {
                setCustomExams([newExam, ...customExams]);
                setIsUploadExamOpen(false);
                showToast(`"${newExam.title}" başarıyla eklendi (${newExam.questions.length} soru ayrıştırıldı).`);
              }}
            />
          )}

          {/* Yeni Hafta Modalı */}
          {isNewWeekOpen && (
            <WeekAddModal
              onClose={() => setIsNewWeekOpen(false)}
              onSave={(newWeek) => {
                setWeeks([newWeek, ...weeks]);
                setIsNewWeekOpen(false);
              }}
            />
          )}
        </div>
      );
    }

    // --- YARDIMCI MODAL BİLEŞENLERİ ---
    function DailyReviewSession({ cards, onComplete, onRate, goal, doneToday }) {
      // Oturum başındaki liste sabitlenir (değerlendirilen kart listeden düşünce sıradaki kart atlanmasın)
      const [queue] = useState(() => cards);
      const [idx, setIdx] = useState(0);
      const [revealed, setRevealed] = useState(false);
      const [dragX, setDragX] = useState(0);
      const [dragY, setDragY] = useState(0);
      const touch = useRef(null);
      const card = queue[idx];

      const handleRating = (rating) => {
        if (!card) return;
        triggerHaptic(35);
        onRate(card.id, rating);
        setRevealed(false); setDragX(0); setDragY(0);
        if (idx + 1 < queue.length) setIdx(idx + 1);
        else onComplete();
      };

      // Klavye: Boşluk = anlamı göster, 1-4 = değerlendir
      useEffect(() => {
        const onKey = (e) => {
          if (/input|textarea|select/i.test((e.target && e.target.tagName) || '')) return;
          if (!revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); setRevealed(true); }
          else if (revealed && /^[1-4]$/.test(e.key)) handleRating(+e.key);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      // Dokunmatik ve Kaydırma Jestleri (Mobile Swipe Gestures)
      const onTouchStart = (e) => {
        touch.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      };
      const onTouchMove = (e) => {
        if (touch.current != null) {
          const dx = e.touches[0].clientX - touch.current.x;
          const dy = e.touches[0].clientY - touch.current.y;
          setDragX(dx);
          setDragY(dy);
        }
      };
      const onTouchEnd = () => {
        if (!revealed) {
          // Kart kapalıyken hafifçe yukarı kaydırılırsa veya dokunulursa aç
          if (dragY < -40 || Math.abs(dragX) > 40) setRevealed(true);
        } else {
          // Anlam açıkken: Sağa = İyi (3), Sola = Tekrar (1), Yukarı = Zor (2)
          if (dragX > 70) {
            handleRating(3);
          } else if (dragX < -70) {
            handleRating(1);
          } else if (dragY < -60 && Math.abs(dragY) > Math.abs(dragX)) {
            handleRating(2);
          }
        }
        setDragX(0);
        setDragY(0);
        touch.current = null;
      };

      if (!card) return null;
      const preview = [1, 2, 3, 4].map(g => fsrsNext(card.srs, g).interval);
      const isUp = dragY < -40 && Math.abs(dragY) > Math.abs(dragX);
      const swipeHint = dragX > 40 ? 'İyi →' : dragX < -40 ? '← Tekrar' : isUp ? '↑ Zor' : '';
      const borderCls = dragX > 40 ? 'border-emerald-500 shadow-emerald-950/50' : dragX < -40 ? 'border-red-500 shadow-red-950/50' : isUp ? 'border-amber-500 shadow-amber-950/50' : 'border-slate-800';

      return (
        <div
          onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
          style={{
            transform: (dragX || (isUp && dragY)) ? `translate(${dragX}px, ${isUp ? dragY : 0}px) rotate(${dragX / 30}deg)` : undefined,
            transition: (dragX || dragY) ? 'none' : 'transform .2s ease-out'
          }}
          className={"bg-slate-950 p-6 sm:p-8 rounded-3xl border shadow-2xl text-center space-y-6 " + borderCls}>
          <div className="flex items-center justify-between text-xs text-slate-400 font-bold">
            <span>Kart {idx + 1} / {queue.length}</span>
            {goal > 0 && <span className={doneToday >= goal ? 'text-emerald-400' : ''}>🎯 Bugün {doneToday}/{goal}</span>}
          </div>
          {swipeHint && (
            <div className={"text-base font-black animate-pulse " + (dragX > 0 ? 'text-emerald-400' : dragX < 0 ? 'text-red-400' : 'text-amber-400')}>
              {swipeHint}
            </div>
          )}
          <div>
            <div className="flex items-center justify-center gap-1.5">
              <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-950 text-blue-300">{card.partOfSpeech}</span>
              {card.questionType && (
                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-950 border border-indigo-800 text-indigo-300">
                  {card.questionType.split(' ')[0]}
                </span>
              )}
            </div>
            <h2 className="text-3xl font-black text-white mt-2">{card.english}</h2>
            {card.ipa && <p className="text-xs text-slate-400 font-mono mt-1">/{card.ipa}/</p>}
            {card.okunus && <p className="text-xs text-amber-300 mt-0.5">[{card.okunus}]</p>}
            <button onClick={() => playWord(card)} className="mt-2 text-xs text-blue-400">🔊 Dinle</button>
          </div>

          {revealed ? (
            <div className="space-y-4 pt-4 border-t border-slate-800">
              <p className="text-2xl font-bold text-blue-400">{card.turkish}</p>
              {card.originalSentence && (
                <p className="text-xs text-slate-300 font-serif italic">"{card.originalSentence}"</p>
              )}
              {(card.examples || []).slice(0, 2).map((ex, i) => <p key={i} className="text-[11px] text-slate-400 font-serif">• {ex}</p>)}
              {((card.synonyms || []).length > 0 || (card.antonyms || []).length > 0) && (
                <div className="text-[11px] space-y-0.5">
                  {(card.synonyms || []).length > 0 && <p><span className="text-slate-500">Eş anlamlı:</span> <span className="text-emerald-300">{card.synonyms.slice(0, 5).join(', ')}</span></p>}
                  {(card.antonyms || []).length > 0 && <p><span className="text-slate-500">Zıt anlamlı:</span> <span className="text-red-300">{card.antonyms.slice(0, 4).join(', ')}</span></p>}
                </div>
              )}
              <div className="grid grid-cols-4 gap-2 pt-2">
                {[[1, 'Tekrar', 'bg-red-950/60 border-red-800 text-red-300'], [2, 'Zor', 'bg-amber-950/60 border-amber-800 text-amber-300'], [3, 'İyi', 'bg-blue-950/60 border-blue-800 text-blue-300'], [4, 'Kolay', 'bg-emerald-950/60 border-emerald-800 text-emerald-300']].map(([g, label, cls]) => (
                  <button key={g} onClick={() => handleRating(g)} className={"p-2.5 rounded-xl border text-xs font-bold " + cls}>
                    {label}<span className="block text-[10px] font-normal opacity-80">{g === 1 ? 'yarın' : formatInterval(preview[g - 1])}</span>
                  </button>
                ))}
              </div>
              <p className="text-[10px] text-slate-400 mt-2">
                📱 Telefonda: <b>Sağa</b> = İyi, <b>Sola</b> = Tekrar, <b>Yukarı</b> = Zor · ⌨ Klavye: 1-4
              </p>
            </div>
          ) : (
            <button onClick={() => setRevealed(true)} className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-lg">
              Anlamını Göster <span className="opacity-60 font-normal">(boşluk veya yukarı kaydır)</span>
            </button>
          )}
        </div>
      );
    }

    // --- AKADEMİK KELİME LİSTESİ (AWL, Coxhead 2000): 570 kelime ailesi, 10 alt liste (1 = en sık) ---
    const AWL_SUBLISTS = [
      'analyse approach area assess assume authority available benefit concept consist constitute context contract create data define derive distribute economy environment establish estimate evident export factor finance formula function identify income indicate individual interpret involve issue labour legal legislate major method occur percent period policy principle proceed process require research respond role section sector significant similar source specific structure theory vary',
      'achieve acquire administrate affect appropriate aspect assist category chapter commission community complex compute conclude conduct consequent construct consume credit culture design distinct element equate evaluate feature final focus impact injure institute invest item journal maintain normal obtain participate perceive positive potential previous primary purchase range region regulate relevant reside resource restrict secure seek select site strategy survey text tradition transfer',
      'alternative circumstance comment compensate component consent considerable constant constrain contribute convene coordinate core corporate correspond criteria deduce demonstrate document dominate emphasis ensure exclude framework fund illustrate immigrate imply initial instance interact justify layer link locate maximise minor negate outcome partner philosophy physical proportion publish react register rely remove scheme sequence sex shift specify sufficient task technical technique technology valid volume',
      'access adequate annual apparent approximate attitude attribute civil code commit communicate concentrate confer contrast cycle debate despite dimension domestic emerge error ethnic goal grant hence hypothesis implement implicate impose integrate internal investigate job label mechanism obvious occupy option output overall parallel parameter phase predict principal prior professional project promote regime resolve retain series statistic status stress subsequent sum summary undertake',
      'academy adjust alter amend aware capacity challenge clause compound conflict consult contact decline discrete draft enable energy enforce entity equivalent evolve expand expose external facilitate fundamental generate generation image liberal licence logic margin medical mental modify monitor network notion objective orient perspective precise prime psychology pursue ratio reject revenue stable style substitute sustain symbol target transit trend version welfare whereas',
      'abstract accurate acknowledge aggregate allocate assign attach author bond brief capable cite cooperate discriminate display diverse domain edit enhance estate exceed expert explicit federal fee flexible furthermore gender ignorant incentive incidence incorporate index inhibit initiate input instruct intelligence interval lecture migrate minimum ministry motive neutral nevertheless overseas precede presume rational recover reveal scope subsidy tape trace transform transport underlie utilise',
      'adapt adult advocate aid channel chemical classic comprehensive comprise confirm contrary convert couple decade definite deny differentiate dispose dynamic eliminate empirical equip extract file finite foundation globe grade guarantee hierarchy identical ideology infer innovate insert intervene isolate media mode paradigm phenomenon priority prohibit publication quote release reverse simulate sole somewhat submit successor survive thesis topic transmit ultimate unique visible voluntary',
      'abandon accompany accumulate ambiguous append appreciate arbitrary automate bias chart clarify commodity complement conform contemporary contradict crucial currency denote detect deviate displace drama eventual exhibit exploit fluctuate guideline highlight implicit induce inevitable infrastructure inspect intense manipulate minimise nuclear offset paragraph plus practitioner predominant prospect radical random reinforce restore revise schedule tension terminate theme thereby uniform vehicle via virtual visual widespread',
      'accommodate analogy anticipate assure attain behalf bulk cease coherent coincide commence compatible concurrent confine controversy converse device devote diminish distort duration erode ethic format found inherent insight integral intermediate manual mature mediate medium military minimal mutual norm overlap passive portion preliminary protocol qualitative refine relax restrain revolution rigid route scenario sphere subordinate supplement suspend team temporary trigger unify violate vision',
      'adjacent albeit assemble collapse colleague compile conceive convince depress encounter enormous forthcoming incline integrity intrinsic invoke levy likewise nonetheless notwithstanding odd ongoing panel persist pose reluctance so-called straightforward undergo whereby',
    ].map(s => s.split(' '));
    // Kelime ailesi eşleşmesi: kısa kelimeler birebir, uzunlarda ortak kök (analyse ↔ analysis, analytical)
    const AWL_INDEX = (() => {
      const exact = new Map(), stems = [];
      const amToBr = (w) => w.replace(/ize$/, 'ise').replace(/yze$/, 'yse').replace(/^labor/, 'labour').replace(/^license/, 'licence');
      AWL_SUBLISTS.forEach((words, i) => words.forEach(h => {
        exact.set(h, i + 1);
        if (h.length > 5) stems.push([h.slice(0, Math.max(5, h.length - 2)), i + 1]);
      }));
      return { exact, stems, amToBr };
    })();
    const AWL_FALSE = new Set(['found', 'founded', 'textile', 'texture', 'sexy', 'teammate']);
    const awlSublist = (word) => {
      if (!word) return 0;
      let w = String(word).toLowerCase().trim();
      if (AWL_FALSE.has(w)) return 0;
      w = AWL_INDEX.amToBr(w);
      if (AWL_INDEX.exact.has(w)) return AWL_INDEX.exact.get(w);
      for (const base of [w.replace(/(s|es|ed|ing|ly)$/, ''), w.replace(/ies$/, 'y'), w.replace(/ied$/, 'y')]) if (AWL_INDEX.exact.has(base)) return AWL_INDEX.exact.get(base);
      for (const [stem, n] of AWL_INDEX.stems) if (w.startsWith(stem)) return n;
      return 0;
    };
    const AwlBadge = ({ word }) => { const n = awlSublist(word); return n ? <span title={'Akademik Kelime Listesi, alt liste ' + n + ' (1 = en sık)'} className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-purple-950 text-purple-300">AWL {n}</span> : null; };

    // --- İSTATİSTİK YARDIMCILARI ---
    const isActiveDay = (a) => a && ((a.reviews || 0) + (a.examQ || 0)) > 0;
    function computeStreak(activity) {
      const active = new Set(activity.filter(isActiveDay).map(a => a.id));
      let d = getTodayStr();
      if (!active.has(d)) d = addDays(d, -1);              // bugün henüz çalışılmadıysa dünden say
      let n = 0;
      while (active.has(d)) { n++; d = addDays(d, -1); }
      return n;
    }
    function bestStreak(activity) {
      const days = activity.filter(isActiveDay).map(a => a.id).sort();
      let best = 0, cur = 0, prev = null;
      days.forEach(d => { cur = prev && addDays(prev, 1) === d ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
      return best;
    }
    const daysUntil = (dateStr) => dateStr ? Math.ceil((Date.parse(dateStr + 'T00:00:00') - Date.parse(getTodayStr() + 'T00:00:00')) / 86400000) : null;

    function StatBox({ label, value, sub, cls }) {
      return (
        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
          <p className={"text-xs " + (cls || 'text-slate-400')}>{label}</p>
          <p className={"text-2xl font-black mt-1 " + (cls || 'text-white')}>{value}</p>
          {sub && <p className="text-[11px] text-slate-500 mt-0.5">{sub}</p>}
        </div>
      );
    }

    function StatsSection({ cards, activity, settings, setSettings }) {
      const today = getTodayStr();
      const todayRec = activity.find(a => a.id === today) || {};
      const goal = settings.dailyGoal || 20;
      const streak = computeStreak(activity), best = bestStreak(activity);
      const left = daysUntil(settings.examDate);

      // Son 30 gün
      const days30 = Array.from({ length: 30 }, (_, i) => addDays(today, i - 29));
      const byDay = new Map(activity.map(a => [a.id, a]));
      const maxRev = Math.max(goal, ...days30.map(d => (byDay.get(d) || {}).reviews || 0), 1);
      const added30 = days30.map(d => cards.filter(c => (c.createdAt || '').slice(0, 10) === d).length);

      // Kart durumları
      const states = { new: 0, learning: 0, review: 0, mastered: 0 };
      cards.forEach(c => { const s = (c.srs && c.srs.state) || 'new'; states[s] = (states[s] || 0) + 1; });
      const stateMeta = [['new', 'Yeni', 'bg-slate-500'], ['learning', 'Öğreniliyor', 'bg-amber-500'], ['review', 'Tekrar', 'bg-blue-500'], ['mastered', 'Kalıcı', 'bg-emerald-500']];

      // Önümüzdeki 7 gün
      const forecast = Array.from({ length: 7 }, (_, i) => {
        const d = addDays(today, i);
        return { d, n: cards.filter(c => c.srs && (i === 0 ? c.srs.nextReviewAt <= d : c.srs.nextReviewAt === d)).length };
      });
      const maxF = Math.max(1, ...forecast.map(f => f.n));

      // Sınav başarısı (tüm zamanlar)
      const exam = {};
      activity.forEach(a => Object.entries(a.examByType || {}).forEach(([t, [c, n]]) => { exam[t] = exam[t] || [0, 0]; exam[t][0] += c; exam[t][1] += n; }));
      const totalRev = activity.reduce((s, a) => s + (a.reviews || 0), 0);
      const totalCorrect = activity.reduce((s, a) => s + (a.correct || 0), 0);

      const hardest = [...cards].filter(c => c.srs && ((c.srs.lapses || 0) > 0 || c.srs.difficulty > 6))
        .sort((a, b) => ((b.srs.lapses || 0) - (a.srs.lapses || 0)) || ((b.srs.difficulty || 0) - (a.srs.difficulty || 0))).slice(0, 10);
      const dayLabel = (d) => new Date(d + 'T00:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });

      return (
        <div className="space-y-5">
          {/* Sınav sayacı + hedef + seri */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-gradient-to-br from-indigo-700 to-blue-800 p-5 rounded-2xl text-white space-y-2">
              <p className="text-xs text-blue-100">📅 YÖKDİL sınavına</p>
              <p className="text-3xl font-black">{left == null ? '—' : left > 0 ? left + ' gün' : left === 0 ? 'Bugün!' : 'Geçti'}</p>
              <label className="block text-[11px] text-blue-100">Sınav tarihi
                <input type="date" value={settings.examDate || ''} onChange={e => setSettings({ ...settings, examDate: e.target.value })}
                       className="mt-1 w-full px-2 py-1 rounded-md bg-white/15 border border-white/20 text-white text-xs" />
              </label>
              {left > 0 && cards.length > 0 && <p className="text-[11px] text-blue-100">Günde ~{Math.ceil(Math.max(0, 600 - cards.length) / left)} yeni kelime ile sınava kadar 600 kelimeye ulaşırsınız.</p>}
            </div>
            <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-2">
              <p className="text-xs text-slate-400">🎯 Bugünkü hedef</p>
              <p className="text-3xl font-black text-white">{todayRec.reviews || 0}<span className="text-base text-slate-500"> / {goal} tekrar</span></p>
              <div className="h-2 rounded bg-slate-800 overflow-hidden"><div className={"h-full " + ((todayRec.reviews || 0) >= goal ? 'bg-emerald-500' : 'bg-blue-500')} style={{ width: Math.min(100, (todayRec.reviews || 0) / goal * 100) + '%' }} /></div>
              <label className="flex items-center gap-2 text-[11px] text-slate-400">Günlük hedef
                <input type="number" min="5" max="300" step="5" value={goal} onChange={e => setSettings({ ...settings, dailyGoal: clampN(+e.target.value || 20, 5, 300) })}
                       className="w-16 px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-white text-xs" />
              </label>
            </div>
            <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-1">
              <p className="text-xs text-slate-400">🔥 Çalışma serisi</p>
              <p className="text-3xl font-black text-orange-400">{streak} gün</p>
              <p className="text-[11px] text-slate-500">En uzun seri: {best} gün</p>
              <p className="text-[11px] text-slate-500">{isActiveDay(todayRec) ? 'Bugün çalıştınız ✓' : 'Seriyi korumak için bugün tekrar yapın.'}</p>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <StatBox label="Toplam kelime" value={cards.length} sub={added30.reduce((a, b) => a + b, 0) + ' tanesi son 30 günde'} />
            <StatBox label="Toplam tekrar" value={totalRev} sub={totalRev ? '%' + Math.round(totalCorrect / totalRev * 100) + ' doğru hatırlama' : '—'} cls="text-blue-400" />
            <StatBox label="Kalıcı hafızada" value={states.mastered} sub="30+ gün aralıklı" cls="text-emerald-400" />
            <StatBox label="Çözülen soru" value={activity.reduce((s, a) => s + (a.examQ || 0), 0)} sub={(() => { const q = activity.reduce((s, a) => s + (a.examQ || 0), 0), c = activity.reduce((s, a) => s + (a.examCorrect || 0), 0); return q ? '%' + Math.round(c / q * 100) + ' doğru' : 'Sınavlar sekmesinden'; })()} cls="text-purple-400" />
          </div>

          {/* Son 30 gün */}
          <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-bold text-sm text-white">Son 30 gün</h3>
              <span className="text-[10px] text-slate-500"><span className="inline-block w-2 h-2 bg-blue-500 rounded-sm mr-1" />tekrar <span className="inline-block w-2 h-2 bg-emerald-500 rounded-sm ml-2 mr-1" />yeni kelime · çizgi: hedef</span>
            </div>
            <div className="relative h-32 flex items-end gap-[3px]">
              <div className="absolute left-0 right-0 border-t border-dashed border-slate-600" style={{ bottom: (goal / maxRev * 100) + '%' }} />
              {days30.map((d, i) => {
                const r = (byDay.get(d) || {}).reviews || 0;
                return (
                  <div key={d} className="flex-1 flex flex-col justify-end h-full" title={dayLabel(d) + ': ' + r + ' tekrar, ' + added30[i] + ' yeni kelime'}>
                    <div className="bg-emerald-500/80 rounded-t-sm" style={{ height: Math.min(100, added30[i] / maxRev * 100) + '%' }} />
                    <div className={"rounded-t-sm " + (d === today ? 'bg-blue-400' : 'bg-blue-600')} style={{ height: (r / maxRev * 100) + '%' }} />
                  </div>
                );
              })}
            </div>
            <div className="flex justify-between text-[10px] text-slate-500 mt-1"><span>{dayLabel(days30[0])}</span><span>Bugün</span></div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {/* Kart durumları */}
            <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3">
              <h3 className="font-bold text-sm text-white">Kartların durumu</h3>
              <div className="h-3 rounded-full overflow-hidden flex bg-slate-800">
                {stateMeta.map(([k, , c]) => states[k] ? <div key={k} className={c} style={{ width: (states[k] / Math.max(1, cards.length) * 100) + '%' }} /> : null)}
              </div>
              <div className="grid grid-cols-2 gap-1 text-xs">

    }

    function DifficultSection({ cards, onUnmark, onStudy }) {
      const list = cards.filter(c => c.isDifficult || (c.srs && c.srs.lapses >= 3));
      if (!list.length) {
        return <div className="text-center py-16 bg-slate-950 rounded-2xl border border-dashed border-slate-800 text-xs text-slate-400">Zorlandığınız kelime yok. Sınavda yanlış yaptığınız veya tekrarda sık unuttuğunuz kelimeler burada toplanır.</div>;

                  <span className="ml-auto text-[10px] text-red-300">{(c.srs && c.srs.lapses) || 0}× unutuldu</span>
                </div>
                <p className="text-xs text-blue-300 font-semibold">{c.turkish}</p>
                {c.originalSentence && <p className="text-[11px] text-slate-400 font-serif italic line-clamp-2">"{c.originalSentence}"</p>}
                {c.isDifficult && <button onClick={() => onUnmark(c.id)} className="text-[10px] text-slate-500 hover:text-slate-300 underline">Artık zorlanmıyorum</button>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- SINAV TARZI SORULAR (YÖKDİL formatı; kendi metin ve kartlarınızdan, API anahtarı gerektirmez) ---
    const shuffleArr = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const pickN = (a, n) => shuffleArr(a).slice(0, n);
    const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const plainText = (t) => String(t || '').replace(/^##\s+.*$/gm, '').replace(/\s+\n/g, '\n');
    const splitSentences = (t) => (t.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+["”’)]?/g) || []).map(s => s.trim()).filter(s => s.split(' ').length >= 6 && s.split(' ').length <= 45);
    const firstMeaning = (c) => String(c.turkish || '').split(/[,;]/)[0].trim();

    // Kelimeyi cümledeki çekime uydur (assemble + "d" → assembled, study + "ies" → studies)
    const inflectLike = (word, suffix) => {
      const w = word.toLowerCase();
      if (!suffix) return w;
      if (/^(d|ed)$/.test(suffix)) return /e$/.test(w) ? w + 'd' : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ied' : w + 'ed';
      if (/^(s|es|ies)$/.test(suffix)) return /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : /(s|x|z|ch|sh)$/.test(w) ? w + 'es' : w + 's';
      if (suffix === 'ing') return /[^e]e$/.test(w) ? w.slice(0, -1) + 'ing' : w + 'ing';
      return w + suffix;
    };
    // Cümlede kartın geçtiği biçimi ve eki bul
    const findForm = (sentence, lemma) => {
      const l = lemma.toLowerCase();
      const stems = [l, /e$/.test(l) ? l.slice(0, -1) : null, /y$/.test(l) ? l.slice(0, -1) : null].filter(Boolean);
      for (const st of stems) {
        const m = sentence.match(new RegExp('\\b(' + escRe(st) + '[a-z]{0,4})\\b', 'i'));
        if (m) {
          const form = m[1];
          if (!form.toLowerCase().startsWith(l) && !/^(d|ed|s|es|ies|ing|ied)$/.test(form.toLowerCase().slice(st.length))) continue;
          let suffix = form.toLowerCase().slice(l.length);
          if (!form.toLowerCase().startsWith(l)) suffix = form.toLowerCase().slice(st.length);
          if (suffix === 'ied') suffix = 'ed';
          return { form, suffix, index: m.index };
        }
      }
      return null;
    };

    const LINKERS = {
      'zıtlık': ['however', 'although', 'even though', 'whereas', 'nevertheless', 'nonetheless', 'despite', 'in spite of', 'on the other hand', 'in contrast', 'though'],
      'sebep-sonuç': ['therefore', 'thus', 'hence', 'consequently', 'as a result', 'because', 'because of', 'due to', 'since'],
      'ekleme': ['moreover', 'furthermore', 'in addition', 'besides', 'additionally'],
      'örnekleme': ['for example', 'for instance', 'such as'],
      'koşul': ['unless', 'provided that', 'as long as', 'in case'],
      'benzerlik': ['similarly', 'likewise'],
      'amaç': ['in order to', 'so that', 'so as to'],
    };
    const LINKER_LIST = Object.entries(LINKERS).flatMap(([cat, ws]) => ws.map(w => ({ w, cat })));

    const LETTERS = ['A', 'B', 'C', 'D', 'E'];
    const makeQ = (type, prompt, options, correct, explain, extra) => {
      const opts = shuffleArr(options);
      return { type, prompt, options: opts, answer: opts.indexOf(correct), explain, ...(extra || {}) };
    };

    function genVocabQuestions(cards, n) {
      const usable = cards.filter(c => c.originalSentence && !isMissingMeaning(c) && findForm(c.originalSentence, c.lemma || c.english));
      if (usable.length < 1 || cards.length < 5) return [];
      return pickN(usable, n).map(c => {
        const lemma = (c.lemma || c.english).toLowerCase();
        const f = findForm(c.originalSentence, lemma);
        const blanked = c.originalSentence.slice(0, f.index) + '----' + c.originalSentence.slice(f.index + f.form.length);
        const others = cards.filter(x => (x.lemma || x.english).toLowerCase() !== lemma && /^[a-z]+$/i.test(x.lemma || x.english));
        const samePos = others.filter(x => x.partOfSpeech === c.partOfSpeech);
        const pool = [...pickN(samePos, 4), ...pickN(others.filter(x => !samePos.includes(x)), 4)].slice(0, 4);
        if (pool.length < 4) return null;
        const correct = f.form.toLowerCase();
        const opts = [correct, ...pool.map(x => inflectLike(x.lemma || x.english, f.suffix))];
        if (new Set(opts).size < 5) return null;
        return makeQ('Kelime', blanked, opts, correct,
          '"' + lemma + '" = ' + c.turkish + '. Cümle: "' + c.originalSentence + '"',
          { cardIds: [c.id] });
      }).filter(Boolean);
    }

    function genLinkerQuestions(readings, n) {
      const found = [];
      readings.forEach(r => splitSentences(plainText(r.content)).forEach(s => {
        const hits = LINKER_LIST.filter(L => new RegExp('\\b' + escRe(L.w) + '\\b', 'i').test(s));
        // tek bir bağlaç içeren cümleler (çok anlamlı olmasın); uzun ifadeyi kısaya tercih et
        const longest = hits.sort((a, b) => b.w.length - a.w.length)[0];
        if (!longest) return;
        const others = hits.filter(h => !longest.w.includes(h.w));
        if (others.length) return;
        found.push({ s, L: longest, title: r.title });
      }));
      return pickN(found, n).map(({ s, L }) => {
        const m = s.match(new RegExp('\\b' + escRe(L.w) + '\\b', 'i'));
        const atStart = m.index === 0;
        const cap = (w) => atStart ? w.charAt(0).toUpperCase() + w.slice(1) : w;
        const blanked = s.slice(0, m.index) + '----' + s.slice(m.index + m[0].length);
        const otherCats = Object.keys(LINKERS).filter(c => c !== L.cat);
        const distract = pickN(otherCats, 4).map(cat => pickN(LINKERS[cat], 1)[0]);
        const correct = cap(L.w);
        return makeQ('Bağlaç', blanked, [correct, ...distract.map(cap)], correct,
          '"' + L.w + '" bir ' + L.cat + ' ifadesidir; cümlenin iki kısmı arasındaki ' + L.cat + ' ilişkisini kurar.');
      });
    }

    function genIrrelevantQuestions(readings, n) {
      const paras = [];
      readings.forEach(r => plainText(r.content).split(/\n\s*\n/).forEach(p => {
        const ss = splitSentences(p);
        if (ss.length >= 5) paras.push({ ss, rid: r.id });
      }));
      const allSent = readings.map(r => ({ rid: r.id, ss: splitSentences(plainText(r.content)) }));
      const out = [];
      for (const p of pickN(paras, n * 2)) {
        const foreign = allSent.filter(x => x.rid !== p.rid && x.ss.length).flatMap(x => x.ss);
        if (!foreign.length) continue;
        const start = Math.floor(Math.random() * (p.ss.length - 4));
        const five = p.ss.slice(start, start + 5);
        const pos = 1 + Math.floor(Math.random() * 4);           // ilk cümle hiçbir zaman değişmez
        five[pos] = pickN(foreign, 1)[0];
        const text = five.map((s, i) => '(' + ['I', 'II', 'III', 'IV', 'V'][i] + ') ' + s).join(' ');
        const opts = ['I', 'II', 'III', 'IV', 'V'];
        out.push({ type: 'Anlamı bozan cümle', prompt: 'Aşağıdaki parçada anlam bütünlüğünü bozan cümle hangisidir?\n\n' + text, options: opts, answer: pos, explain: '(' + opts[pos] + ') numaralı cümle başka bir metinden alındı; paragrafın konusuyla ilgisi yok.' });
        if (out.length >= n) break;
      }
      return out;
    }

    function genMeaningQuestions(cards, n) {
      const usable = cards.filter(c => !isMissingMeaning(c) && firstMeaning(c));
      if (usable.length < 5) return [];
      return pickN(usable, n).map(c => {
        const correct = firstMeaning(c);
        const others = [...new Set(usable.filter(x => x.id !== c.id).map(firstMeaning).filter(m => m && m !== correct))];
        if (others.length < 4) return null;
        return makeQ('Türkçe karşılık', '"' + (c.lemma || c.english) + '" kelimesinin Türkçe karşılığı hangisidir?', [correct, ...pickN(others, 4)], correct,
          (c.lemma || c.english) + ' = ' + c.turkish + (c.originalSentence ? '. Cümle: "' + c.originalSentence + '"' : ''), { cardIds: [c.id] });
      }).filter(Boolean);
    }

    // YÖKDİL Paraphrasing / Eş Anlamlı Soru Üretici
    function genSynonymQuestions(cards, n) {
      const usable = cards.filter(c => c.synonyms && c.synonyms.length > 0);
      if (usable.length < 2) return [];
      return pickN(usable, n).map(c => {
        const correct = c.synonyms[0];
        const otherCards = cards.filter(x => x.id !== c.id);
        const otherWords = [
          ...otherCards.flatMap(x => x.synonyms || []),
          ...otherCards.map(x => x.lemma || x.english)
        ].filter(w => w && w.toLowerCase() !== correct.toLowerCase() && !c.synonyms.map(s => s.toLowerCase()).includes(w.toLowerCase()));
        const uniqueOthers = [...new Set(otherWords)];
        if (uniqueOthers.length < 4) return null;
        const distractors = pickN(uniqueOthers, 4);
        return makeQ(
          'Eş Anlamlı (Synonym)',
          '"' + (c.lemma || c.english) + '" kelimesinin en yakın eş anlamlısı (synonym) hangisidir?',
          [correct, ...distractors],
          correct,
          '"' + (c.lemma || c.english) + '" kelimesinin eş anlamlıları: ' + c.synonyms.join(', ') + '. Türkçe anlamı: ' + c.turkish,
          { cardIds: [c.id] }
        );
      }).filter(Boolean);
    }

    // --- EDAT EŞLEŞTİRME OYUNU (Preposition Wheel) ---
    // YÖKDİL'in kelime sorularında sık çıkan edatlı kalıplar. Birden fazla edatla doğru olabilenler (result in/from,
    // involved in/with, concerned with/about…) belirsiz oldukları için listeye alınmadı.
    const PREP_OPTIONS = ['to', 'of', 'from', 'in', 'on', 'with', 'for', 'at'];
    const PREP_PAIRS = [
      ['attribute', 'to', '-e bağlamak, -e atfetmek'], ['prone', 'to', '-e yatkın'], ['susceptible', 'to', '-e karşı savunmasız'], ['contribute', 'to', '-e katkıda bulunmak'],
      ['adhere', 'to', '-e bağlı kalmak, uymak'], ['resort', 'to', '-e başvurmak'], ['succumb', 'to', '-e yenik düşmek'], ['object', 'to', '-e itiraz etmek'],
      ['consent', 'to', '-e razı olmak'], ['equivalent', 'to', '-e eşdeğer'], ['similar', 'to', '-e benzer'], ['exposed', 'to', '-e maruz kalmış'],
      ['subject', 'to', '-e tabi'], ['confined', 'to', '-e sınırlı'], ['adapt', 'to', '-e uyum sağlamak'], ['respond', 'to', '-e yanıt vermek'],
      ['refer', 'to', '-e değinmek, atıfta bulunmak'], ['access', 'to', '-e erişim'], ['threat', 'to', '-e tehdit'], ['solution', 'to', '-e çözüm'],
      ['approach', 'to', '-e yaklaşım'], ['contribution', 'to', '-e katkı'], ['alternative', 'to', '-e alternatif'], ['vulnerable', 'to', '-e karşı savunmasız'],
      ['immune', 'to', '-e karşı bağışık'], ['detrimental', 'to', '-e zararlı'], ['conducive', 'to', '-e elverişli'], ['akin', 'to', '-e benzer'],
      ['stem', 'from', '-den kaynaklanmak'], ['derive', 'from', '-den türemek, elde etmek'], ['refrain', 'from', '-den kaçınmak'], ['abstain', 'from', '-den uzak durmak'],
      ['differ', 'from', '-den farklı olmak'], ['benefit', 'from', '-den yararlanmak'], ['suffer', 'from', '-den muzdarip olmak'], ['emerge', 'from', '-den ortaya çıkmak'],
      ['recover', 'from', '-den iyileşmek'], ['prevent', 'from', '-den alıkoymak'], ['exempt', 'from', '-den muaf'], ['distinguish', 'from', '-den ayırt etmek'],
      ['originate', 'from', '-den kaynaklanmak'], ['deviate', 'from', '-den sapmak'], ['withdraw', 'from', '-den çekilmek'],
      ['deprive', 'of', '-den yoksun bırakmak'], ['consist', 'of', '-den oluşmak'], ['dispose', 'of', '-den kurtulmak, elden çıkarmak'], ['accuse', 'of', '-le suçlamak'],
      ['approve', 'of', '-i onaylamak'], ['devoid', 'of', '-den yoksun'], ['indicative', 'of', '-in göstergesi'], ['characteristic', 'of', '-e özgü'],
      ['tolerant', 'of', '-e hoşgörülü'], ['conscious', 'of', '-in bilincinde'], ['aware', 'of', '-in farkında'], ['capable', 'of', '-e muktedir'],
      ['independent', 'of', '-den bağımsız'], ['regardless', 'of', '-e bakılmaksızın'], ['lack', 'of', '-in eksikliği'], ['representative', 'of', '-i temsil eden'],
      ['comprised', 'of', '-den oluşan'], ['reminiscent', 'of', '-i hatırlatan'], ['wary', 'of', '-e karşı temkinli'],
      ['invest', 'in', '-e yatırım yapmak'], ['participate', 'in', '-e katılmak'], ['specialize', 'in', '-de uzmanlaşmak'], ['persist', 'in', '-de ısrar etmek'],
      ['succeed', 'in', '-de başarılı olmak'], ['interested', 'in', '-e ilgili'], ['rich', 'in', '-ce zengin'], ['engage', 'in', '-e girişmek, -le uğraşmak'],
      ['belief', 'in', '-e inanç'], ['increase', 'in', '-de artış'], ['decline', 'in', '-de düşüş'], ['instrumental', 'in', '-de etkili, önemli rol oynayan'],
      ['implicated', 'in', '-e karışmış'], ['inherent', 'in', '-in doğasında olan'],
      ['rely', 'on', '-e güvenmek, dayanmak'], ['depend', 'on', '-e bağlı olmak'], ['insist', 'on', '-de ısrar etmek'], ['focus', 'on', '-e odaklanmak'],
      ['comment', 'on', '-e yorum yapmak'], ['emphasis', 'on', '-e vurgu'], ['impact', 'on', '-e etki'], ['reliance', 'on', '-e bağımlılık'],
      ['based', 'on', '-e dayalı'], ['dependent', 'on', '-e bağımlı'], ['embark', 'on', '-e başlamak, girişmek'], ['capitalize', 'on', '-den yararlanmak, fırsata çevirmek'],
      ['comply', 'with', '-e uymak'], ['cope', 'with', '-le başa çıkmak'], ['coincide', 'with', '-le çakışmak, aynı zamana denk gelmek'], ['interfere', 'with', '-e engel olmak, karışmak'],
      ['consistent', 'with', '-le tutarlı'], ['compatible', 'with', '-le uyumlu'], ['associated', 'with', '-le ilişkili'], ['equipped', 'with', '-le donatılmış'],
      ['preoccupied', 'with', '-le meşgul, kafayı takmış'], ['interact', 'with', '-le etkileşimde bulunmak'], ['collaborate', 'with', '-le iş birliği yapmak'], ['correlate', 'with', '-le ilişkili olmak'],
      ['deal', 'with', '-le ilgilenmek, ele almak'], ['faced', 'with', '-le karşı karşıya'], ['fraught', 'with', '-le dolu'], ['grapple', 'with', '-le boğuşmak'],
      ['account', 'for', '-i açıklamak; oluşturmak'], ['compensate', 'for', '-i telafi etmek'], ['substitute', 'for', '-in yerine geçmek'], ['responsible', 'for', '-den sorumlu'],
      ['demand', 'for', '-e talep'], ['need', 'for', '-e ihtiyaç'], ['reason', 'for', '-in sebebi'], ['preference', 'for', '-i tercih'],
      ['eligible', 'for', '-e uygun, hak sahibi'], ['notorious', 'for', '-le kötü şöhretli'], ['renowned', 'for', '-le ünlü'], ['strive', 'for', '-için çabalamak'],
      ['marvel', 'at', '-e hayret etmek'], ['adept', 'at', '-de usta'], ['glance', 'at', '-e göz atmak'],
    ].map(([w, p, tr]) => ({ w, p, tr }));

    function PrepositionGame({ readings, onAnswer, best, onBest }) {
      const [state, setState] = useState('idle');      // idle | playing | done
      const [tab, setTab] = useState('game');          // game | matrix
      const [selectedPrep, setSelectedPrep] = useState('to');
      const [left, setLeft] = useState(60);
      const [item, setItem] = useState(null);
      const [score, setScore] = useState(0);
      const [answered, setAnswered] = useState(0);
      const [combo, setCombo] = useState(0);
      const [wrong, setWrong] = useState([]);
      const [flash, setFlash] = useState(null);           // 'ok' | 'bad'
      const deck = useRef([]);

      // Kalıp sizin metinlerinizde geçiyorsa cümlesiyle sor
      const contexts = useRef(null);
      const findContext = (it) => {
        if (!contexts.current) contexts.current = readings.flatMap(r => splitSentences(plainText(r.content)));
        const re = new RegExp('\\b(' + escRe(it.w) + '[a-z]{0,3})\\s+' + it.p + '\\b', 'i');
        const s = contexts.current.find(x => re.test(x));
        if (!s) return null;
        const m = s.match(re);
        return { before: s.slice(0, m.index + m[1].length), after: s.slice(m.index + m[0].length) };
      };
      const next = () => {
        if (!deck.current.length) deck.current = shuffleArr(PREP_PAIRS);
        const it = deck.current.pop();
        setItem({ ...it, ctx: findContext(it) });
      };
      const start = () => { setScore(0); setAnswered(0); setCombo(0); setWrong([]); setLeft(60); deck.current = shuffleArr(PREP_PAIRS); setState('playing'); next(); };

      useEffect(() => {
        if (state !== 'playing') return;
        if (left <= 0) { setState('done'); if (score > (best || 0)) onBest(score); return; }
        const t = setTimeout(() => setLeft(l => l - 1), 1000);
        return () => clearTimeout(t);
      }, [state, left]);

      const pick = (p) => {
        if (state !== 'playing' || !item) return;
        const ok = p === item.p;
        setAnswered(a => a + 1);
        if (ok) { setScore(s => s + 1); setCombo(c => c + 1); }
        else { setCombo(0); setWrong(w => [...w, { ...item, picked: p }]); }
        onAnswer(ok);
        setFlash(ok ? 'ok' : 'bad');
        setTimeout(() => setFlash(null), 250);
        next();
      };

      // Klavye kısayolu: 1-8
      useEffect(() => {
        const onKey = (e) => { if (state === 'playing' && /^[1-8]$/.test(e.key)) pick(PREP_OPTIONS[+e.key - 1]); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      if (state === 'idle' || state === 'done') {
        const prepItems = PREP_PAIRS.filter(x => x.p === selectedPrep);
        return (
          <div className="max-w-2xl mx-auto bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-bold text-lg text-white">🎯 YÖKDİL Preposition Matrix & Çarkı</h3>
              <div className="flex gap-1.5">
                <button
                  onClick={() => setTab('game')}
                  className={"px-3 py-1 rounded-lg text-xs font-bold transition " + (tab === 'game' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300')}
                >
                  ⚡ Hızlı Çark (60 sn)
                </button>
                <button
                  onClick={() => setTab('matrix')}
                  className={"px-3 py-1 rounded-lg text-xs font-bold transition " + (tab === 'matrix' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300')}
                >
                  📊 Preposition Matrix
                </button>
              </div>
            </div>

            {tab === 'matrix' ? (
              <div className="space-y-4">
                <p className="text-xs text-slate-400">YÖKDİL sınavında en çok sorulan sabit edatlı yapıları kategori bazında inceleyin ve pekiştirin:</p>
                <div className="flex flex-wrap gap-1.5">
                  {PREP_OPTIONS.map(p => (
                    <button
                      key={p}
                      onClick={() => setSelectedPrep(p)}
                      className={"px-3 py-1.5 rounded-lg text-xs font-bold transition " + (selectedPrep === p ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800')}
                    >
                      {p} ({PREP_PAIRS.filter(x => x.p === p).length})
                    </button>
                  ))}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-1">
                  {prepItems.map((it, i) => (
                    <div key={i} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between gap-2">
                      <div>
                        <span className="text-sm font-black text-white">{it.w} <span className="text-indigo-400 font-bold">{it.p}</span></span>
                        <p className="text-[11px] text-slate-400 mt-0.5">{it.tr}</p>
                      </div>
                      <button onClick={() => playWord({ english: it.w + ' ' + it.p })} className="text-xs text-blue-400 hover:text-blue-300 px-1.5 py-1 rounded bg-slate-800">🔊</button>
                    </div>
                  ))}
                </div>
                <button onClick={() => { setTab('game'); start(); }} className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs hover:bg-indigo-500">
                  Şimdi Çarkı Başlat (Pratik Yap) →
                </button>
              </div>
            ) : (
              <div className="space-y-4">
                <p className="text-xs text-slate-400">YÖKDİL kelime sorularının önemli kısmı edatlı kalıplardan gelir (attribute <b>to</b>, stem <b>from</b>, deprive <b>of</b>…). Kalıbı gör, doğru edatı olabildiğince hızlı seç. Kalıp metinlerinizde geçiyorsa orijinal cümleyle sorulur.</p>
                {state === 'done' && (
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                    <p className="text-2xl font-black text-white">{score} doğru <span className="text-sm text-slate-400">/ {answered} cevap · en iyi: {Math.max(best || 0, score)}</span></p>
                    {wrong.length > 0 && (
                      <div className="space-y-1 max-h-48 overflow-y-auto">
                        <p className="text-[11px] text-slate-500">Yanlışlarınız:</p>
                        {wrong.map((x, i) => <p key={i} className="text-xs text-slate-300"><b className="text-white">{x.w} <span className="text-emerald-400">{x.p}</span></b> = {x.tr} <span className="text-red-400 line-through ml-1">{x.picked}</span></p>)}
                      </div>
                    )}
                  </div>
                )}
                <button onClick={start} className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-500">{state === 'done' ? 'Tekrar oyna' : 'Başla'}</button>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto space-y-3">
          <div className="flex items-center justify-between text-xs">
            <span className={"font-black text-lg " + (left <= 10 ? 'text-red-400' : 'text-white')}>⏱ {left}</span>
            <span className="text-slate-300">Doğru: <b className="text-emerald-400">{score}</b> {combo >= 3 && <span className="text-orange-400 font-bold ml-1">🔥 x{combo}</span>}</span>
          </div>
          <div className="h-1.5 rounded bg-slate-800 overflow-hidden"><div className="h-full bg-blue-500 transition-all" style={{ width: (left / 60 * 100) + '%' }} /></div>
          <div className={"p-6 rounded-2xl border text-center transition-colors " + (flash === 'ok' ? 'border-emerald-500 bg-emerald-950/30' : flash === 'bad' ? 'border-red-500 bg-red-950/30' : 'border-slate-800 bg-slate-950')}>
            {item && (item.ctx ? (
              <p className="text-base text-slate-100 font-serif leading-relaxed">{item.ctx.before} <span className="inline-block min-w-[3rem] border-b-2 border-blue-400 text-blue-300">&nbsp;?&nbsp;</span> {item.ctx.after}</p>
            ) : (
              <p className="text-3xl font-black text-white">{item.w} <span className="inline-block min-w-[3.5rem] border-b-4 border-blue-400 text-blue-300">?</span></p>
            ))}
            {item && item.ctx && <p className="text-[10px] text-slate-500 mt-2">Kalıp: <b className="text-slate-300">{item.w} ___</b> · sizin metninizden</p>}
          </div>
          <div className="grid grid-cols-4 gap-2">
            {PREP_OPTIONS.map((p, i) => (
              <button key={p} onClick={() => pick(p)} className="py-3 rounded-xl bg-slate-800 hover:bg-blue-600 text-white font-bold text-sm">
                {p}<span className="block text-[9px] font-normal text-slate-400">{i + 1}</span>
              </button>
            ))}
          </div>
          <button onClick={() => setLeft(0)} className="text-xs text-slate-500 hover:text-slate-300">Bitir</button>
        </div>
      );
    }

    // Soru metnindeki bağlam ipuçlarını (bağlaç / geçiş ifadeleri) vurgula ve açıklamasını üret
    const CLUE_WORDS = (() => {
      const m = new Map();
      LINKER_LIST.forEach(L => m.set(L.w, L.cat));
      [['while', 'zıtlık'], ['but', 'zıtlık'], ['yet', 'zıtlık'], ['unlike', 'zıtlık'], ['rather than', 'zıtlık'], ['instead of', 'zıtlık'], ['so', 'sebep-sonuç'], ['thereby', 'sebep-sonuç'], ['accordingly', 'sebep-sonuç'], ['as well as', 'ekleme'], ['also', 'ekleme']].forEach(([w, c]) => { if (!m.has(w)) m.set(w, c); });
      return [...m.entries()].sort((a, b) => b[0].length - a[0].length);
    })();
    const CLUE_HINT = {
      'zıtlık': 'zıtlık bildirir → boşluğa gelen kelime, cümlenin öbür yarısıyla ZIT anlamlı olmalı',
      'sebep-sonuç': 'sebep-sonuç bildirir → boşluk, öbür yarının SONUCU ya da SEBEBİ olacak anlamda olmalı',
      'ekleme': 'ekleme bildirir → boşluk, önceki fikirle AYNI yönde olmalı',
      'benzerlik': 'benzerlik bildirir → boşluk, önceki fikre BENZER olmalı',
      'örnekleme': 'örnek verir → boşluk, verilen örnekleri KAPSAYAN genel bir kavram olmalı',
      'koşul': 'koşul bildirir → boşluk, koşul gerçekleşince/gerçekleşmeyince olacak durumu anlatır',
      'amaç': 'amaç bildirir → boşluk, ulaşılmak istenen hedefi anlatır',
    };
    function renderWithClues(text) {
      const found = [];
      const re = new RegExp('\\b(' + CLUE_WORDS.map(([w]) => escRe(w)).join('|') + ')\\b', 'gi');
      const parts = []; let last = 0, m;
      while ((m = re.exec(text))) {
        parts.push(text.slice(last, m.index));
        const w = m[0].toLowerCase(), cat = (CLUE_WORDS.find(([x]) => x === w) || [])[1];
        if (cat && !found.some(f => f.w === w)) found.push({ w, cat });
        parts.push(<b key={m.index} className="text-orange-300 bg-orange-500/10 rounded px-0.5">{m[0]}</b>);
        last = m.index + m[0].length;
      }
      parts.push(text.slice(last));
      return { nodes: parts, clues: found };
    }

    function ExamSection({ cards, readings, customExams = [], onOpenUploadExam, onDeleteExam, onExtractVocabFromExam, onMarkDifficult, onAnswer, prepBest, onPrepBest, preset, onPresetUsed, onCheckupDone }) {
      const [examTab, setExamTab] = useState('generator'); // 'generator' | 'uploaded'
      const [mode, setMode] = useState('mixed');
      const [count, setCount] = useState(10);
      const [qs, setQs] = useState(null);
      const [idx, setIdx] = useState(0);
      const [picked, setPicked] = useState({});          // soru index → seçilen şık
      const [marked, setMarked] = useState(false);
      const [prepOpen, setPrepOpen] = useState(false);
      const [timed, setTimed] = useState(null);           // { endAt, total } süreli haftalık check-up
      const [now, setNow] = useState(Date.now());
      const reported = useRef(false);

      const build = (opts) => {
        const m = (opts && opts.mode) || mode, n = (opts && opts.count) || count;
        if (m === 'prep') { setPrepOpen(true); return; }
        const per = m === 'mixed' ? Math.ceil(n / 4) + 1 : n;
        let list = [];
        if (m === 'mixed' || m === 'vocab') list = list.concat(genVocabQuestions(cards, per));
        if (m === 'mixed' || m === 'linker') list = list.concat(genLinkerQuestions(readings, per));
        if (m === 'mixed' || m === 'irrelevant') list = list.concat(genIrrelevantQuestions(readings, m === 'mixed' ? Math.max(1, Math.floor(per / 2)) : per));
        if (m === 'mixed' || m === 'meaning') list = list.concat(genMeaningQuestions(cards, per));
        if (m === 'mixed' || m === 'synonym') list = list.concat(genSynonymQuestions(cards, per));
        list = m === 'mixed' ? shuffleArr(list).slice(0, n) : list.slice(0, n);
        setQs(list); setIdx(0); setPicked({}); setMarked(false); reported.current = false;
        setTimed(opts && opts.seconds && list.length ? { endAt: Date.now() + opts.seconds * 1000, total: opts.seconds } : null);
      };

      const startCustomExam = (ex, filter = 'all') => {
        let qsList = ex.questions || [];
        if (filter === 'vocab') qsList = ex.questions.filter(q => q.num <= 6 || q.category.includes('Kelime'));
        else if (filter === 'grammar') qsList = ex.questions.filter(q => (q.num >= 7 && q.num <= 16) || q.category.includes('Gramer'));
        else if (filter === 'cloze') qsList = ex.questions.filter(q => (q.num >= 17 && q.num <= 26) || q.category.includes('Cloze'));
        else if (filter === 'sentence') qsList = ex.questions.filter(q => (q.num >= 27 && q.num <= 36) || q.category.includes('Cümle Tamamlama'));
        else if (filter === 'translation') qsList = ex.questions.filter(q => (q.num >= 37 && q.num <= 48) || q.category.includes('Çeviri'));
        else if (filter === 'paragraph') qsList = ex.questions.filter(q => q.num >= 49 || q.category.includes('Paragraf'));

        if (!qsList.length) {
          alert('Bu kategoride soru bulunamadı.');
          return;
        }

        const formatted = qsList.map(q => ({
          type: q.category,
          prompt: `[${ex.title} • Soru ${q.num}]\n\n${q.prompt}`,
          options: q.options,
          answer: q.answer >= 0 ? q.answer : 0,
          hasAnswer: q.answer >= 0,
          explain: q.answer >= 0 ? `Doğru Cevap: ${LETTERS[q.answer]}` : 'Bu sorunun cevap anahtarı belirtilmemiş.',
          cardIds: []
        }));

        setQs(formatted);
        setIdx(0);
        setPicked({});
        setMarked(false);
        reported.current = false;
        const totalSec = filter === 'all' ? 180 * 60 : qsList.length * 90;
        setTimed({ endAt: Date.now() + totalSec * 1000, total: totalSec });
      };

      // Haftalık check-up dışarıdan (İstatistikler) başlatılabilir
      useEffect(() => {
        if (preset && preset.weekly) { setPrepOpen(false); build({ mode: 'mixed', count: 20, seconds: 15 * 60 }); onPresetUsed && onPresetUsed(); }
      }, [preset]);

      // Süre sayacı; süre bitince cevaplanmayanlar boş sayılır
      useEffect(() => {
        if (!timed || !qs) return;
        const t = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(t);
      }, [timed, qs]);
      const remaining = timed ? Math.max(0, Math.round((timed.endAt - now) / 1000)) : null;
      useEffect(() => {
        if (timed && qs && remaining === 0 && idx < qs.length) {
          const filled = { ...picked };
          qs.forEach((_, i) => { if (filled[i] === undefined) filled[i] = -1; });
          setPicked(filled); setIdx(qs.length);
        }
      }, [remaining]);

      if (prepOpen) {
        return (
          <div className="space-y-3">
            <button onClick={() => setPrepOpen(false)} className="text-xs text-slate-400 hover:text-blue-400 font-bold">← Sınav türleri</button>
            <PrepositionGame readings={readings} best={prepBest} onBest={onPrepBest} onAnswer={(ok) => onAnswer && onAnswer('Edat', ok)} />
          </div>
        );
      }

      const needs = [];
      if (cards.length < 5) needs.push('en az 5 kelime kartı (şu an ' + cards.length + ')');
      if (!readings.length) needs.push('en az 1 okuma metni');

      if (!qs) {
        return (
          <div className="max-w-2xl mx-auto space-y-4">
            {/* Üst Sekmeler ve PDF Yükleme Butonu */}
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setExamTab('generator')}
                  className={"px-3.5 py-1.5 rounded-xl text-xs font-bold transition " + (examTab === 'generator' ? 'bg-blue-600 text-white shadow' : 'bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800')}
                >
                  🤖 Özgün Soru Üretici
                </button>
                <button
                  type="button"
                  onClick={() => setExamTab('uploaded')}
                  className={"px-3.5 py-1.5 rounded-xl text-xs font-bold transition " + (examTab === 'uploaded' ? 'bg-blue-600 text-white shadow' : 'bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800')}
                >
                  📄 Çıkmış Sınavlarım & Denemeler ({customExams.length})
                </button>
              </div>
              <button
                type="button"
                onClick={onOpenUploadExam}
                className="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white shadow transition flex items-center gap-1.5"
              >
                <span>+ Çıkmış Sınav / Deneme PDF'i Yükle</span>
              </button>
            </div>

            {examTab === 'uploaded' ? (
              customExams.length === 0 ? (
                <div className="bg-slate-950 p-8 rounded-2xl border border-dashed border-slate-800 text-center space-y-3">
                  <div className="text-3xl">📄</div>
                  <h4 className="font-bold text-base text-white">Henüz Bir Sınav PDF'i Yüklemediniz</h4>
                  <p className="text-xs text-slate-400 max-w-md mx-auto">
                    Geçmiş yılların YÖKDİL kitapçıklarını (PDF veya Word) yükleyin. Sistem soruları, şıkları ve YÖKDİL soru tiplerini otomatik olarak ayrıştırarak sınav simülasyonu hazırlar.
                  </p>
                  <button
                    type="button"
                    onClick={onOpenUploadExam}
                    className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow"
                  >
                    + İlk Sınav PDF'inizi Yükleyin
                  </button>
                </div>
              ) : (
                <div className="space-y-3">
                  {customExams.map(ex => {
                    const qCount = ex.questions.length;
                    const vocabCount = ex.questions.filter(q => q.num <= 6 || q.category.includes('Kelime')).length;
                    return (
                      <div key={ex.id} className="p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3 hover:border-slate-700 transition">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-950 border border-indigo-800 text-indigo-300">
                                {ex.field} • {ex.year} {ex.term}
                              </span>
                              <span className="text-[10px] text-slate-400">
                                {qCount} soru
                              </span>
                            </div>
                            <h4 className="font-black text-base text-white mt-1">{ex.title}</h4>
                          </div>
                          <div className="flex items-center gap-1.5">
                            {vocabCount > 0 && onExtractVocabFromExam && (
                              <button
                                type="button"
                                onClick={() => onExtractVocabFromExam(ex)}
                                className="px-2.5 py-1.5 rounded-lg bg-emerald-950/70 border border-emerald-800 text-emerald-300 hover:bg-emerald-900 text-xs font-bold transition flex items-center gap-1"
                                title="Sınavdaki hedef kelimeleri kelime bankanıza aktarır"
                              >
                                ✨ Kelimeleri Bankaya Ekle
                              </button>
                            )}
                            {onDeleteExam && (
                              <button
                                type="button"
                                onClick={() => onDeleteExam(ex.id)}
                                className="px-2.5 py-1.5 rounded-lg bg-red-950/50 border border-red-900/50 text-red-400 hover:bg-red-900 text-xs transition"
                                title="Sınavı Sil"
                              >
                                🗑
                              </button>
                            )}
                          </div>
                        </div>

                        {/* Hızlı Başlatma Butonları */}
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          <button
                            type="button"
                            onClick={() => startCustomExam(ex, 'all')}
                            className="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow"
                          >
                            ▶ Tüm Sınavı Çöz ({qCount} Soru · 180 dk)
                          </button>
                          <button
                            type="button"
                            onClick={() => startCustomExam(ex, 'vocab')}
                            disabled={vocabCount === 0}
                            className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:bg-slate-800 text-xs font-bold text-slate-200 disabled:opacity-40"
                          >
                            Soru 1-6 (Kelime)
                          </button>
                          <button
                            type="button"
                            onClick={() => startCustomExam(ex, 'grammar')}
                            className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:bg-slate-800 text-xs font-bold text-slate-200"
                          >
                            Soru 7-16 (Gramer & Edat)
                          </button>
                          <button
                            type="button"
                            onClick={() => startCustomExam(ex, 'cloze')}
                            className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:bg-slate-800 text-xs font-bold text-slate-200"
                          >
                            Soru 17-26 (Cloze Test)
                          </button>
                          <button
                            type="button"
                            onClick={() => startCustomExam(ex, 'sentence')}
                            className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:bg-slate-800 text-xs font-bold text-slate-200"
                          >
                            Soru 27-36 (Cümle Tamamlama)
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )
            ) : (
              <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h3 className="font-bold text-lg text-white">🎓 YÖKDİL Tarzı Özgün Soru Üretici</h3>
                <p className="text-xs text-slate-400">Sorular sizin okuma metinlerinizden ve kelime kartlarınızdan otomatik üretilir. Her soruda 5 şık vardır; cevabınızdan sonra açıklama gösterilir.</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                  {[['mixed', 'Karışık (önerilen)'], ['vocab', 'Kelime – boşluk doldurma'], ['synonym', '🎯 Eş Anlamlılar (Synonyms)'], ['linker', 'Bağlaç / geçiş ifadeleri'], ['irrelevant', 'Anlamı bozan cümle'], ['meaning', 'Türkçe karşılık'], ['prep', '🎯 Preposition Matrix & Çark']].map(([k, label]) => (
                    <label key={k} className={"flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer " + (mode === k ? 'border-blue-600 bg-blue-600/10 text-white' : 'border-slate-800 text-slate-300')}>
                      <input type="radio" name="examMode" checked={mode === k} onChange={() => setMode(k)} className="accent-blue-500" /> {label}
                    </label>
                  ))}
                </div>
                <div className="flex items-center gap-2 text-xs">
                  <span className="text-slate-400">Soru sayısı</span>
                  {[10, 20, 40].map(n => (
                    <button key={n} onClick={() => setCount(n)} className={"px-3 py-1.5 rounded-lg font-bold " + (count === n ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300')}>{n}</button>
                  ))}
                </div>
                {needs.length > 0 && mode !== 'prep' && <p className="text-[11px] text-amber-400">Daha çok soru için: {needs.join(', ')}. Bağlaç ve anlamı bozan cümle soruları okuma metinlerinden üretilir (ikincisi için en az 2 metin gerekir).</p>}
                <button onClick={() => build()} className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-500">{mode === 'prep' ? 'Oyunu Aç' : 'Sınavı Başlat'}</button>
                <button onClick={() => build({ mode: 'mixed', count: 20, seconds: 15 * 60 })} className="w-full py-2.5 rounded-xl bg-indigo-700 text-white font-bold text-xs hover:bg-indigo-600">
                  ⏱ Haftalık Check-up: 20 soru · 15 dakika{new Date().getDay() === 0 ? ' — bugün check-up günü!' : ''}
                </button>
              </div>
            )}
          </div>
        );
      }

      if (!qs.length) {
        return (
          <div className="max-w-2xl mx-auto bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-3 text-center">
            <p className="text-sm text-slate-300">Bu türde soru üretilecek kadar veri yok.</p>
            <p className="text-xs text-slate-500">Okuma metni yükleyip "✨ Kelimeleri Çıkar" ile kelime ekleyin; sonra tekrar deneyin.</p>
            <button onClick={() => setQs(null)} className="px-4 py-2 rounded-lg bg-slate-800 text-xs text-slate-200">Geri</button>
          </div>
        );
      }

      const answered = Object.keys(picked).length;
      const correctN = qs.filter((q, i) => picked[i] === q.answer).length;
      const done = answered === qs.length && idx >= qs.length;

      if (done) {
        const wrongCardIds = [...new Set(qs.flatMap((q, i) => picked[i] !== q.answer ? (q.cardIds || []) : []))];
        const byType = {};
        qs.forEach((q, i) => { byType[q.type] = byType[q.type] || [0, 0]; byType[q.type][1]++; if (picked[i] === q.answer) byType[q.type][0]++; });
        if (timed && !reported.current) { reported.current = true; setTimeout(() => onCheckupDone && onCheckupDone(correctN, qs.length), 0); }
        const usedSec = timed ? Math.min(timed.total, timed.total - Math.max(0, Math.round((timed.endAt - Date.now()) / 1000))) : 0;
        return (
          <div className="max-w-2xl mx-auto bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
            {timed && <p className="text-xs font-bold text-indigo-300">⏱ Haftalık Check-up · süre: {Math.floor(usedSec / 60)} dk {usedSec % 60} sn{qs.some((_, i) => picked[i] === -1) ? ' · süre doldu, boş bırakılanlar yanlış sayıldı' : ''}</p>}
            <h3 className="font-bold text-lg text-white">Sonuç: {correctN} / {qs.length} <span className="text-slate-400 text-sm">(%{Math.round(correctN / qs.length * 100)})</span></h3>
            {timed && (
              <div className="space-y-2 max-h-[45vh] overflow-y-auto pr-1">
                {qs.map((q, i) => picked[i] === q.answer ? null : (
                  <div key={i} className="p-3 rounded-xl bg-red-950/30 border border-red-900/50 text-xs space-y-1">
                    <p className="text-slate-400">{i + 1}. {q.type}</p>
                    <p className="text-slate-200 font-serif whitespace-pre-wrap line-clamp-4">{q.prompt}</p>
                    <p className="text-emerald-300">Doğru: {LETTERS[q.answer]}) {q.options[q.answer]}{picked[i] >= 0 ? <span className="text-red-300 ml-2">Sizin: {LETTERS[picked[i]]}) {q.options[picked[i]]}</span> : <span className="text-slate-500 ml-2">(boş)</span>}</p>
                    <p className="text-slate-400">{q.explain}</p>
                  </div>
                ))}
              </div>
            )}
            <div className="space-y-1 text-xs">
              {Object.entries(byType).map(([t, [c, n]]) => <p key={t} className="text-slate-300">{t}: <b className={c === n ? 'text-emerald-400' : 'text-amber-300'}>{c}/{n}</b></p>)}
            </div>
            {wrongCardIds.length > 0 && (
              <button disabled={marked} onClick={() => { onMarkDifficult(wrongCardIds); setMarked(true); }} className="px-4 py-2 rounded-lg bg-amber-600 text-xs font-bold text-white disabled:opacity-60">
                {marked ? '✓ Zorlandığım Kelimeler\'e eklendi' : 'Yanlış yaptığım ' + wrongCardIds.length + ' kelimeyi "Zorlandığım Kelimeler"e ekle'}
              </button>
            )}
            <div className="flex gap-2">
              <button onClick={() => build(timed ? { mode: 'mixed', count: 20, seconds: 15 * 60 } : undefined)} className="px-4 py-2 rounded-lg bg-blue-600 text-xs font-bold text-white">Yeni sınav</button>
              <button onClick={() => { setQs(null); setTimed(null); }} className="px-4 py-2 rounded-lg bg-slate-800 text-xs text-slate-200">Ayarlar</button>
            </div>
          </div>
        );
      }

      const q = qs[idx];
      if (!q) return null;
      const my = picked[idx];
      const isAnswered = my !== undefined && !timed;      // süreli denemede geri bildirim sonda
      const showClues = q.type === 'Kelime';
      const rendered = showClues ? renderWithClues(q.prompt) : { nodes: q.prompt, clues: [] };
      return (
        <div className="max-w-2xl mx-auto space-y-3">
          <div className="flex items-center justify-between text-xs text-slate-400">
            <span>Soru {idx + 1} / {qs.length} · <span className="text-blue-300 font-bold">{q.type}</span></span>
            {timed
              ? <span className={"font-black text-sm " + (remaining <= 60 ? 'text-red-400' : 'text-indigo-300')}>⏱ {Math.floor(remaining / 60)}:{String(remaining % 60).padStart(2, '0')}</span>
              : <span>Doğru: {correctN} / {answered}</span>}
          </div>
          <div className="h-1.5 rounded bg-slate-800 overflow-hidden"><div className="h-full bg-blue-500" style={{ width: (idx / qs.length * 100) + '%' }} /></div>
          <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
            <p className="text-sm text-slate-100 font-serif leading-relaxed whitespace-pre-wrap">{rendered.nodes}</p>
            {rendered.clues.length > 0 && (
              <div className="text-[11px] text-orange-200 bg-orange-950/30 border border-orange-900/40 rounded-lg px-3 py-2 space-y-0.5">
                {rendered.clues.map(c => <p key={c.w}>💡 <b>{c.w}</b> {CLUE_HINT[c.cat] || c.cat}</p>)}
              </div>
            )}
            <div className="space-y-2">
              {q.options.map((o, i) => {
                const state = !isAnswered ? 'idle' : i === q.answer ? 'right' : i === my ? 'wrong' : 'dim';
                const cls = { idle: 'border-slate-700 hover:border-blue-500 hover:bg-slate-900', right: 'border-emerald-500 bg-emerald-600/15 text-emerald-200', wrong: 'border-red-500 bg-red-600/15 text-red-200', dim: 'border-slate-800 text-slate-500' }[state];
                return (
                  <button key={i} disabled={isAnswered || (timed && my !== undefined)} onClick={() => {
                    setPicked({ ...picked, [idx]: i });
                    if (onAnswer) onAnswer(q.type, i === q.answer);
                    if (timed) setTimeout(() => setIdx(x => x + 1), 250);     // süreli denemede doğrudan sonraki soru
                  }}
                          className={"w-full text-left px-4 py-2.5 rounded-xl border text-sm transition " + cls}>
                    <b className="mr-2">{LETTERS[i]})</b>{o}
                  </button>
                );
              })}
            </div>
            {isAnswered && (
              <div className={"p-3 rounded-xl text-xs " + (my === q.answer ? 'bg-emerald-950/50 text-emerald-200' : 'bg-red-950/40 text-red-200')}>
                <b>{my === q.answer ? '✓ Doğru!' : '✗ Yanlış. Doğru cevap: ' + LETTERS[q.answer] + ') ' + q.options[q.answer]}</b>
                <p className="mt-1 text-slate-300">{q.explain}</p>
              </div>
            )}
            <div className="flex justify-between">
              {timed ? (
                <>
                  <button onClick={() => { const f = { ...picked }; qs.forEach((_, i) => { if (f[i] === undefined) f[i] = -1; }); setPicked(f); setIdx(qs.length); }} className="text-xs text-slate-500 hover:text-slate-300">Teslim et</button>
                  <button onClick={() => { if (picked[idx] === undefined) setPicked({ ...picked, [idx]: -1 }); setIdx(idx + 1); }} className="px-5 py-2 rounded-lg bg-slate-800 text-xs font-bold text-slate-200">Boş geç →</button>
                </>
              ) : (
                <>
                  <button onClick={() => setQs(null)} className="text-xs text-slate-500 hover:text-slate-300">Sınavı bitir</button>
                  <button disabled={!isAnswered} onClick={() => setIdx(idx + 1)} className="px-5 py-2 rounded-lg bg-blue-600 text-xs font-bold text-white disabled:opacity-40">
                    {idx + 1 < qs.length ? 'Sonraki →' : 'Sonucu gör'}
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SESLİ ÇALIŞMA MODU (tarayıcının konuşma sentezi; İngilizce kelime → Türkçe anlam → örnek cümle) ---
    const speakAsync = (text, lang, rate) => new Promise(resolve => {
      if (!('speechSynthesis' in window) || !text) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = rate || 1;
      const v = window.speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith(lang.slice(0, 2)));
      if (v) u.voice = v;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      u.onend = finish; u.onerror = finish;
      setTimeout(finish, 6000 + text.length * 150);           // bazı tarayıcılarda onend gelmeyebilir
      window.speechSynthesis.speak(u);
    });

    function AudioStudyModal({ cards, dueCards, onClose }) {
      const [source, setSource] = useState(dueCards.length ? 'due' : 'all');
      const [rate, setRate] = useState(0.9);
      const [withSentence, setWithSentence] = useState(true);
      const [loop, setLoop] = useState(false);
      const [shuffleOn, setShuffleOn] = useState(false);
      const [playing, setPlaying] = useState(false);
      const [idx, setIdx] = useState(0);
      const [phase, setPhase] = useState('');
      const run = useRef(0);

      const base = source === 'due' ? dueCards : source === 'difficult' ? cards.filter(c => c.isDifficult || (c.srs && c.srs.lapses >= 3)) : cards;
      const [order, setOrder] = useState(() => base.map(c => c.id));
      useEffect(() => { setOrder((shuffleOn ? shuffleArr(base) : base).map(c => c.id)); setIdx(0); stop(); }, [source, shuffleOn]);
      const list = order.map(id => cards.find(c => c.id === id)).filter(Boolean);
      const card = list[idx];
      const hasTr = typeof speechSynthesis !== 'undefined' && speechSynthesis.getVoices().some(v => /^tr/i.test(v.lang));

      const stop = () => { run.current++; setPlaying(false); setPhase(''); try { speechSynthesis.cancel(); } catch (e) {} };
      useEffect(() => () => stop(), []);

      const play = async (from) => {
        const my = ++run.current;
        setPlaying(true);
        const pause = (ms) => new Promise(r => setTimeout(r, ms / rate));
        for (let i = from; ; i++) {
          if (i >= list.length) { if (loop && list.length) i = 0; else break; }
          if (run.current !== my) return;
          setIdx(i);
          const c = list[i];
          setPhase('en'); await speakAsync(c.english, 'en-US', rate); if (run.current !== my) return;
          await pause(1200); if (run.current !== my) return;
          setPhase('tr'); await speakAsync(firstMeaning(c) || c.turkish, 'tr-TR', rate); if (run.current !== my) return;
          if (withSentence && c.originalSentence) {
            await pause(700); if (run.current !== my) return;
            setPhase('sentence'); await speakAsync(c.originalSentence, 'en-US', rate * 0.95); if (run.current !== my) return;
          }
          await pause(1500);
        }
        if (run.current === my) { setPlaying(false); setPhase(''); }
      };

      const jump = (d) => { const n = clampN(idx + d, 0, Math.max(0, list.length - 1)); stop(); setIdx(n); };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div role="dialog" aria-label="Sesli çalışma" className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-4">
            <div className="flex items-center">
              <h3 className="font-bold text-base text-white mr-auto">🎧 Dinleyerek Çalış</h3>
              <button onClick={() => { stop(); onClose(); }} aria-label="Kapat" className="px-2 py-1 rounded-md text-slate-400 hover:bg-slate-800">✕</button>
            </div>
            <div className="grid grid-cols-3 gap-1 text-[11px]">
              {[['due', 'Bugünküler (' + dueCards.length + ')'], ['difficult', 'Zorlandıklarım'], ['all', 'Tümü (' + cards.length + ')']].map(([k, l]) => (
                <button key={k} onClick={() => setSource(k)} className={"px-2 py-1.5 rounded-lg font-bold " + (source === k ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300')}>{l}</button>
              ))}
            </div>

            <div className="text-center py-6 rounded-2xl bg-slate-950 border border-slate-800 min-h-[9rem] flex flex-col justify-center gap-1 px-4">
              {!card ? <p className="text-xs text-slate-500">Bu grupta kart yok.</p> : (
                <>
                  <p className={"text-2xl font-black " + (phase === 'en' ? 'text-white' : 'text-slate-300')}>{card.english}</p>
                  {card.okunus && <p className="text-[11px] text-amber-300">[{card.okunus}]</p>}
                  <p className={"text-base font-bold " + (phase === 'tr' ? 'text-blue-300' : 'text-blue-300/60')}>{card.turkish}</p>
                  {withSentence && card.originalSentence && <p className={"text-[11px] font-serif italic " + (phase === 'sentence' ? 'text-slate-200' : 'text-slate-500')}>"{card.originalSentence}"</p>}
                  <p className="text-[10px] text-slate-600 mt-1">{idx + 1} / {list.length}</p>
                </>
              )}
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => jump(-1)} disabled={!card} aria-label="Önceki" className="w-10 h-10 rounded-full bg-slate-800 text-white disabled:opacity-40">⏮</button>
              <button onClick={() => playing ? stop() : play(idx)} disabled={!card} aria-label={playing ? 'Duraklat' : 'Oynat'} className="w-14 h-14 rounded-full bg-blue-600 text-white text-xl font-bold disabled:opacity-40">{playing ? '⏸' : '▶'}</button>
              <button onClick={() => jump(1)} disabled={!card} aria-label="Sonraki" className="w-10 h-10 rounded-full bg-slate-800 text-white disabled:opacity-40">⏭</button>
            </div>
