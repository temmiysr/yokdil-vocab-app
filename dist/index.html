  <!-- Standalone Browser App -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- TEMEL VERİ KATMANI (Offline-first localStorage) ---
    const STORAGE_KEYS = {
      WEEKS: 'yokdil_weeks_v1',
      READINGS: 'yokdil_readings_v1',
      VOCAB: 'yokdil_vocab_cards_v1',
      SETTINGS: 'yokdil_user_settings_v1',
      ACTIVITY: 'yokdil_activity_v1',      // günlük çalışma kaydı: [{ id: 'YYYY-MM-DD', reviews, correct, again, newCards, examQ, examCorrect, examByType }]
    };

    function getStored(key, def) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : def;
      } catch (e) {
        return def;
      }
    }

    function setStored(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    // --- KALICI DEPOLAMA: IndexedDB ---
    // localStorage ~5 MB ile sınırlı; uzun OCR metinleri ve çok sayıda kartla dolabilir. Veriler artık IndexedDB'de
    // (yüzlerce MB) tutulur. İlk açılışta localStorage'daki eski veriler kopyalanır ve geri okunarak doğrulanır;
    // eski kayıtlar SİLİNMEZ (yedek olarak kalır).
    const IDB_NAME = 'yokdil-master', IDB_STORE = 'kv';
    const STORAGE_MODE_KEY = 'yokdil_storage_mode_v2';   // 'idb' → veriler IndexedDB'de
    let idbPromise = null;
    const idbOpen = () => {
      if (!idbPromise) {
        idbPromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) return reject(new Error('IndexedDB yok'));
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
          req.onblocked = () => reject(new Error('IndexedDB engellendi'));
        });
        idbPromise.catch(() => { idbPromise = null; });
      }
      return idbPromise;
    };
    const idbGet = async (key) => {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    };
    const idbSet = async (key, val) => {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('İşlem iptal edildi'));
      });
    };
    const isQuotaError = (e) => !!e && (e.name === 'QuotaExceededError' || e.code === 22 || /quota/i.test(e.message || ''));

    // Açılışta tüm veriyi yükler (gerekirse localStorage → IndexedDB taşıması yapar)
    const DATA_KEYS = [STORAGE_KEYS.WEEKS, STORAGE_KEYS.READINGS, STORAGE_KEYS.VOCAB, STORAGE_KEYS.SETTINGS, STORAGE_KEYS.ACTIVITY];
    async function loadAllData() {
      const fromLocal = () => Object.fromEntries(DATA_KEYS.map(k => [k, getStored(k, undefined)]));
      try {
        if (localStorage.getItem(STORAGE_MODE_KEY) === 'idb') {
          const out = {};
          for (const k of DATA_KEYS) {
            const v = await idbGet(k);
            out[k] = v !== undefined ? v : getStored(k, undefined);   // IndexedDB'de yoksa eski yedeğe düş
          }
          return { data: out, mode: 'idb' };
        }
        // İlk açılış: taşı + doğrula
        const local = fromLocal();
        for (const k of DATA_KEYS) if (local[k] !== undefined) await idbSet(k, local[k]);
        for (const k of DATA_KEYS) {
          if (local[k] === undefined) continue;
          const back = await idbGet(k);
          if (JSON.stringify(back) !== JSON.stringify(local[k])) throw new Error('Taşıma doğrulanamadı: ' + k);
        }
        localStorage.setItem(STORAGE_MODE_KEY, 'idb');
        try { localStorage.setItem('yokdil_migrated_at', new Date().toISOString()); } catch (e) {}
        return { data: local, mode: 'idb', migrated: true };
      } catch (e) {
        console.warn('IndexedDB kullanılamadı, localStorage ile devam ediliyor:', e);
        return { data: fromLocal(), mode: 'local', error: e };
      }
    }

    // Tek bir anahtarı kalıcı kaydeder; başarısızsa hatayı döndürür
    async function persistKey(mode, key, val) {
      try {
        if (mode === 'idb') await idbSet(key, val);
        else localStorage.setItem(key, JSON.stringify(val));
        return null;
      } catch (e) {
        return e;
      }
    }

    // --- SM-2 ARALIKLI TEKRAR MOTORU ---
    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function addDays(dateStr, days) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function createSRS(cardId) {
      return {
        cardId,
        state: 'new',
        interval: 0,
        easeFactor: 2.5,
        repetitions: 0,
        lapses: 0,
        lastReviewedAt: null,
        nextReviewAt: getTodayStr(),
      };
    }

    // --- FSRS (Free Spaced Repetition Scheduler, v4.5 varsayılan ağırlıklar) ---
    // Her kart için hafıza "dayanıklılığı" (stability, gün) ve "zorluk" (difficulty, 1-10) tutulur.
    // Kart, hatırlama olasılığı hedefin (%90) altına düşeceği gün tekrar sorulur.
    // Eski SM-2 kartları ilk tekrarda kendi aralık/kolaylık değerlerinden FSRS'ye çevrilir (geçmiş kaybolmaz).
    const FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
    const FSRS_RETENTION = 0.9, FSRS_DECAY = -0.5, FSRS_FACTOR = 19 / 81;
    const clampN = (x, a, b) => Math.min(b, Math.max(a, x));
    const fsrsInitD = (g) => clampN(FSRS_W[4] - (g - 3) * FSRS_W[5], 1, 10);
    const fsrsRetr = (days, s) => Math.pow(1 + FSRS_FACTOR * days / s, FSRS_DECAY);
    const fsrsInterval = (s) => clampN(Math.round(s / FSRS_FACTOR * (Math.pow(FSRS_RETENTION, 1 / FSRS_DECAY) - 1)), 1, 36500);
    const daysBetween = (a, b) => Math.max(0, Math.round((Date.parse(b) - Date.parse(a)) / 86400000));

    function fsrsNext(item, rating) {
      const g = rating, w = FSRS_W;
      const today = getTodayStr();
      let S = item.stability, D = item.difficulty;
      const reviewed = item.repetitions > 0 || (item.state && item.state !== 'new');
      if (!(S > 0) && reviewed) {
        // SM-2 kartını çevir: dayanıklılık ≈ mevcut aralık, zorluk ≈ kolaylık katsayısından
        S = Math.max(0.5, item.interval || 1);
        D = clampN(11 - ((item.easeFactor || 2.5) - 1.3) * 5, 1, 10);
      }
      let lapses = item.lapses || 0;
      if (!(S > 0)) {
        S = w[g - 1];
        D = fsrsInitD(g);
        if (g === 1) lapses += 1;
      } else {
        const elapsed = item.lastReviewedAt ? daysBetween(item.lastReviewedAt.slice(0, 10), today) : (item.interval || 0);
        const R = fsrsRetr(elapsed, S);
        const D1 = D - w[6] * (g - 3);
        D = clampN(w[7] * fsrsInitD(4) + (1 - w[7]) * D1, 1, 10);
        if (g === 1) {
          S = Math.min(S, w[11] * Math.pow(D, -w[12]) * (Math.pow(S + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R)));
          lapses += 1;
        } else if (elapsed < 1) {
          // aynı gün tekrar: dayanıklılık değişmez (kolayda hafif artış)
          if (g === 4) S = S * 1.2;
        } else {
          const hard = g === 2 ? w[15] : 1, easy = g === 4 ? w[16] : 1;
          S = S * (Math.exp(w[8]) * (11 - D) * Math.pow(S, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * hard * easy + 1);
        }
      }
      const interval = g === 1 ? 1 : fsrsInterval(S);
      return {
        ...item,
        stability: Math.round(S * 1000) / 1000,
        difficulty: Math.round(D * 1000) / 1000,
        state: g === 1 ? 'learning' : interval >= 30 ? 'mastered' : interval >= 7 ? 'review' : 'learning',
        interval,
        repetitions: (item.repetitions || 0) + 1,
        lapses,
        lastReviewedAt: new Date().toISOString(),
        nextReviewAt: addDays(today, interval),
      };
    }

    function processReview(item, rating) { return fsrsNext(item, rating); }

    // Düğmelerde gösterilecek sonraki aralık ("3 gün", "2 ay")
    const formatInterval = (d) => d < 30 ? d + ' gün' : d < 365 ? Math.round(d / 30) + ' ay' : (Math.round(d / 36.5) / 10) + ' yıl';

    // --- TELAFFUZ (SpeechSynthesis) ---
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    // --- CÜMLE ÇIKARMA VE MÜKERRER KONTROLÜ ---
    function extractSentence(text, target) {
      if (!text || !target) return '';
      const idx = text.toLowerCase().indexOf(target.toLowerCase());
      if (idx === -1) return target;

      let start = idx;
      while (start > 0) {
        const c = text[start - 1];
        if (c === '\n') break;
        if (['.', '!', '?'].includes(c)) {
          const pre = text.slice(Math.max(0, start - 8), start).toLowerCase();
          if (!/(e\.g|i\.e|e\.|i\.|dr|mr|vs|etc|u\.s)\.$/i.test(pre)) break;
        }
        start--;
      }

      let end = idx + target.length;
      while (end < text.length) {
        const c = text[end];
        if (c === '\n') break;
        if (['.', '!', '?'].includes(c)) {
          const sub = text.slice(Math.max(0, end - 6), end + 1).toLowerCase();
          const next = text.slice(end + 1, Math.min(text.length, end + 4)).toLowerCase();
          const isAbbr = /(e\.g|i\.e|dr|mr|vs|etc|u\.s)\.$/i.test(sub) || (/\b[a-z]\.$/i.test(sub) && /^[a-z]\./i.test(next));
          if (!isAbbr) { end++; break; }
        }
        end++;
      }
      return text.slice(start, end).trim().replace(/\s+/g, ' ');
    }

    // Akıllı Kalıp İfade Genişletme (Smart Phrase Expansion)
    function findSmartCollocation(sentence, target) {
      if (!sentence || !target || target.length < 2) return '';
      const cleanTarget = target.trim();
      const lowerSentence = sentence.toLowerCase();
      const lowerTarget = cleanTarget.toLowerCase();
      const idx = lowerSentence.indexOf(lowerTarget);
      if (idx === -1) return '';

      const beforeText = sentence.slice(0, idx).trim();
      const afterText = sentence.slice(idx + cleanTarget.length).trim();

      const beforeTokens = beforeText ? beforeText.split(/\s+/) : [];
      const afterTokens = afterText ? afterText.split(/\s+/) : [];

      const prepositions = new Set(['of', 'to', 'in', 'on', 'with', 'for', 'from', 'at', 'by', 'into', 'as', 'about', 'against', 'upon', 'between']);
      const articles = new Set(['a', 'an', 'the']);
      const verbs = new Set(['is', 'are', 'was', 'were', 'be', 'been', 'being', 'have', 'has', 'had', 'remains', 'remained', 'becomes', 'became', 'can', 'could', 'will', 'would', 'shall', 'should', 'may', 'might', 'must']);

      if (afterTokens.length >= 2 && prepositions.has(afterTokens[0].toLowerCase().replace(/[^a-z]/g, ''))) {
        const prep = afterTokens[0].replace(/[^a-z]/g, '');
        const nextWords = [];
        let i = 1;
        if (i < afterTokens.length && articles.has(afterTokens[i].toLowerCase().replace(/[^a-z]/g, ''))) {
          nextWords.push(afterTokens[i]);
          i++;
        }
        while (i < afterTokens.length && nextWords.length < 2) {
          const cleanW = afterTokens[i].replace(/[.,;:!?()"']/g, '');
          if (!cleanW || prepositions.has(cleanW.toLowerCase()) || verbs.has(cleanW.toLowerCase())) break;
          nextWords.push(cleanW);
          i++;
        }
        if (nextWords.length > 0) {
          return (cleanTarget + ' ' + prep + ' ' + nextWords.join(' ')).trim();
        }
      }

      if (beforeTokens.length >= 1 && cleanTarget.split(/\s+/).length <= 2) {
        const prevWord = beforeTokens[beforeTokens.length - 1].replace(/^[.,;:!?()"']+|[.,;:!?()"']+$/g, '');
        if (prevWord.length > 2 && !articles.has(prevWord.toLowerCase()) && !prepositions.has(prevWord.toLowerCase())) {
          return (prevWord + ' ' + cleanTarget).trim();
        }
      }
      return '';
    }

    // Dokunsal Titreşim (Haptics) Desteği
    function triggerHaptic(duration = 30) {
      try {
        if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(duration);
        }
      } catch (e) {}
    }

    // Bionic Reading Kelime Biçimlendirici (Akademik Odaklanma)
    function formatBionicWord(word, key) {
      const m = word.match(/^([^A-Za-z]*)([A-Za-z]+)([^A-Za-z]*)$/);
      if (!m) return word + ' ';
      const lead = m[1], letters = m[2], trail = m[3];
      const len = letters.length;
      const fix = len <= 3 ? 1 : len <= 5 ? 2 : len <= 7 ? 3 : Math.ceil(len * 0.45);
      const boldPart = letters.slice(0, fix);
      const restPart = letters.slice(fix);
      return (
        <span key={key}>
          {lead}
          <strong className="font-extrabold text-white">{boldPart}</strong>
          <span className="opacity-80">{restPart}</span>
          {trail}{' '}
        </span>
      );
    }

    // --- YÖKDİL ÇIKMIŞ SINAV & DENEME AYRIŞTIRICI (EXAM PARSER) ---
    function parseYokdilExamText(text, answerKeyText = '') {
      if (!text || text.trim().length < 20) return [];

      const answersMap = new Map();
      const combinedForKeys = (answerKeyText + '\n' + text);
      const keyMatches = combinedForKeys.matchAll(/(?:^|[\s,;])(\d{1,2})\s*[-.:)]\s*([A-Ea-e])(?=[\s,;]|$)/g);
      for (const km of keyMatches) {
        const qn = parseInt(km[1], 10);
        const ans = km[2].toUpperCase();
        if (qn >= 1 && qn <= 80 && !answersMap.has(qn)) {
          answersMap.set(qn, ans);
        }
      }

      const clean = text
        .replace(/\r\n/g, '\n')
        .replace(/\d{1,2}\s*[-–]\s*\d{1,2}\.\s*sorularda[^\n]+/gi, '')
        .replace(/CEVAP ANAHTARI[\s\S]*$/i, '');

      const qRegex = /(?:^|\n)\s*(\d{1,2})\s*[\.\)]\s*([\s\S]*?)(?=(?:^|\n)\s*\d{1,2}\s*[\.\)]|\s*$)/g;
      const questions = [];

      for (const m of clean.matchAll(qRegex)) {
        const num = parseInt(m[1], 10);
        const body = m[2].trim();
        if (num < 1 || num > 80 || body.length < 10) continue;

        const optRegex = /(?:^|\s|\n)([A-Ea-e])\s*[\)\.\-]\s*([\s\S]*?)(?=(?:^|\s|\n)[A-Ea-e]\s*[\)\.\-]|\s*$)/g;
        const optsFound = [];
        let promptEnd = -1;

        for (const om of body.matchAll(optRegex)) {
          if (promptEnd === -1) {
            promptEnd = om.index;
          }
          optsFound.push({ letter: om[1].toUpperCase(), text: om[2].trim().replace(/\s+/g, ' ') });
        }

        if (optsFound.length >= 4) {
          const prompt = promptEnd > 0 ? body.slice(0, promptEnd).trim().replace(/\s+/g, ' ') : body;
          const options = ['A', 'B', 'C', 'D', 'E'].map(L => {
            const found = optsFound.find(o => o.letter === L);
            return found ? found.text : '';
          });

          let category = 'Genel';
          if (num <= 6) category = 'Kelime Soruları (Soru 1-6)';
          else if (num <= 16) category = 'Gramer & Edat (Soru 7-16)';
          else if (num <= 26) category = 'Cloze Test (Soru 17-26)';
          else if (num <= 36) category = 'Cümle Tamamlama (Soru 27-36)';
          else if (num <= 48) category = 'Çeviri Soruları (Soru 37-48)';
          else if (num <= 60) category = 'Paragraf & Anlam Bütünlüğü (Soru 49-60)';
          else category = 'Okuma Parçası Soruları (Soru 61-80)';

          const correctLetter = answersMap.get(num);
          const answerIdx = correctLetter ? ['A', 'B', 'C', 'D', 'E'].indexOf(correctLetter) : -1;

          questions.push({
            num,
            prompt,
            options,
            answer: answerIdx,
            category,
            correctLetter: correctLetter || ''
          });
        }
      }

      return questions;
    }

    // --- OTOMATİK KELİME ÇIKARMA VE SÖZLÜK ---
    // Kaynaklar (ücretsiz, anahtar gerektirmez; yalnızca İngilizce kelime gönderilir):
    //   Datamuse (kelime sıklığı, eş/zıt anlam) · dictionaryapi.dev (IPA, ses, tanım, örnek) · MyMemory (Türkçe karşılık)

    // Çok yaygın İngilizce kelimeler (öğrenme listesine alınmaz)
    const STOPWORDS = new Set((
      'the be to of and a in that have i it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us is are was were been being has had did does done said made used such each many much more very own same both few those here where why own while through during before above below between under again further once off down should may might must shall upon among within without into onto toward towards against along around across behind beyond however therefore thus although though whether either neither also yet still already always never often sometimes usually perhaps maybe really quite rather almost enough every another something anything nothing everything someone anyone everyone nobody thing things part parts place case point group number fact hand high great small large long little old big right left last next early late young sure able bad best better less least whole real true full open per via etc mr mrs ms dr st vs'
    ).split(/\s+/));

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // Hata/hız sınırına karşı tekrar denemeli JSON isteği (404 → null)
    // cache:'no-store' → tarayıcı önbelleği kullanılmaz. Datamuse gibi servisler CORS izin başlığını tek bir adrese göre
    // önbelleğe yazdırıyor; aynı tarayıcıda başka adresten (localhost ↔ github.io) açınca istekler engelleniyordu.
    // Sonuçlar zaten uygulamanın kendi önbelleğinde (freq/dict cache) tutuluyor.
    // Datamuse'un sunucu önbelleği izin başlığını adres ayırt etmeden 24 saat saklıyor; adrese özel parametre ile ayrı önbellek
    const ORIGIN_TAG = (() => { try { return btoa(location.origin).replace(/[^a-z0-9]/gi, '').slice(-12); } catch (e) { return 'x'; } })();
    const fetchJson = async (url, tries = 3) => {
      if (/api\.datamuse\.com/.test(url)) url += (url.includes('?') ? '&' : '?') + 'o=' + ORIGIN_TAG;
      for (let a = 0; a < tries; a++) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (r.status === 404) return null;
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return await r.json();
        } catch (e) {
          if (a === tries - 1) throw e;
          await sleep(500 * (a + 1));
        }
      }
    };

    // Sınırlı eşzamanlılıkla iş havuzu
    const runPool = async (items, limit, fn, onProgress) => {
      const res = new Array(items.length);
      let next = 0, done = 0;
      const worker = async () => {
        while (next < items.length) {
          const k = next++;
          try { res[k] = await fn(items[k], k); } catch (e) { res[k] = null; }
          done++;
          if (onProgress) onProgress(done, items.length);
        }
      };
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
      return res;
    };

    // Basit önbellek (aynı kelime için tekrar istek atmamak için)
    const CACHE_KEYS = { FREQ: 'yokdil_freq_cache_v1', DICT: 'yokdil_dict_cache_v2' };
    try { localStorage.removeItem('yokdil_dict_cache_v1'); } catch (e) {}           // eski (yalnızca MyMemory) önbellek
    const cacheGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch (e) { return {}; } };
    // Önbellek en fazla CACHE_MAX kayıt tutar (en eskiler atılır) ki asıl verilere yer kalsın
    const CACHE_MAX = 1500;
    const cacheSet = (k, v) => {
      const keys = Object.keys(v);
      if (keys.length > CACHE_MAX) keys.slice(0, keys.length - CACHE_MAX).forEach(x => delete v[x]);
      try { localStorage.setItem(k, JSON.stringify(v)); }
      catch (e) { try { localStorage.removeItem(k); } catch (e2) {} }   // yer yoksa önbelleği bırak
    };

    // Datamuse: kelimenin sıklığı (milyonda) ve etiketleri; bulunamazsa null
    const freqCache = cacheGet(CACHE_KEYS.FREQ);
    const lookupFreq = async (w) => {
      if (w in freqCache) return freqCache[w];
      const j = await fetchJson('https://api.datamuse.com/words?sp=' + encodeURIComponent(w) + '&md=fp&max=1');
      let v = null;
      if (j && j[0] && j[0].word === w) {
        const tags = j[0].tags || [];
        const f = parseFloat((tags.find(t => t.startsWith('f:')) || 'f:0').slice(2));
        v = { f, tags: tags.filter(t => !t.startsWith('f:')) };
      }
      freqCache[w] = v;
      return v;
    };

    // Kural tabanlı kök adayları (transformed → transform, studies → study, stopped → stop)
    const lemmaCandidates = (w) => {
      const c = [w];
      if (/ies$/.test(w)) c.push(w.slice(0, -3) + 'y');
      if (/(ches|shes|sses|xes|zes|oes)$/.test(w)) c.push(w.slice(0, -2));
      if (/s$/.test(w) && !/(ss|us|is)$/.test(w)) c.push(w.slice(0, -1));
      if (/ied$/.test(w)) c.push(w.slice(0, -3) + 'y');
      if (/ed$/.test(w)) { const s = w.slice(0, -2); c.push(s, s + 'e'); if (/([b-df-hj-np-tv-z])\1$/.test(s)) c.push(s.slice(0, -1)); }
      if (/ing$/.test(w)) { const s = w.slice(0, -3); c.push(s, s + 'e'); if (/([b-df-hj-np-tv-z])\1$/.test(s)) c.push(s.slice(0, -1)); }
      return [...new Set(c)].filter(x => x.length >= 3);
    };

    // Kelimeyi köküne indir: kök adayı yeterince yaygınsa (orijinalin ≥%30'u) onu seç
    const resolveLemma = async (w) => {
      const cands = lemmaCandidates(w);
      const infos = await Promise.all(cands.map(c => lookupFreq(c).catch(() => null)));
      const orig = infos[0];
      let best = null;
      cands.forEach((c, i) => {
        if (i === 0 || !infos[i]) return;
        if (!best || infos[i].f > best.info.f) best = { word: c, info: infos[i] };
      });
      if (best && (!orig || best.info.f >= orig.f * 0.3)) return best;
      return orig ? { word: w, info: orig } : null;
    };

    // Metinden öğrenmeye değer kelime adaylarını çıkarır
    const extractCandidates = async (text, { maxFreq, minFreq = 0.2, onProgress }) => {
      const plain = text.replace(/^##\s+/gm, '');
      const counts = new Map();
      (plain.match(/[A-Za-z]+(?:['’][A-Za-z]+)?/g) || []).forEach(tok => {
        if (/['’]/.test(tok)) tok = tok.replace(/['’]s$/i, '');
        if (/['’]/.test(tok)) return;
        const w = tok.toLowerCase();
        if (w.length < 4 || STOPWORDS.has(w)) return;
        const e = counts.get(w) || { count: 0, surface: tok };
        e.count++;
        counts.set(w, e);
      });
      const words = [...counts.keys()];
      const resolved = await runPool(words, 4, resolveLemma, onProgress);
      cacheSet(CACHE_KEYS.FREQ, freqCache);

      const groups = new Map();
      words.forEach((w, i) => {
        const r = resolved[i];
        if (!r || !r.info) return;                                     // sözlükte yok (isim, OCR hatası...)
        if (r.info.tags.includes('prop')) return;                       // özel isim
        if (STOPWORDS.has(r.word)) return;
        if (r.info.f > maxFreq || r.info.f < minFreq) return;           // çok yaygın / çok nadir
        const g = groups.get(r.word) || { lemma: r.word, freq: r.info.f, tags: r.info.tags, count: 0, forms: [] };
        g.count += counts.get(w).count;
        g.forms.push(counts.get(w).surface);
        groups.set(r.word, g);
      });
      return [...groups.values()].map(g => ({ ...g, pos: posFor(g.lemma, g.forms, g.tags), sentence: extractSentence(plain, g.forms[0]) }));
    };

    // Datamuse etiketinden kelime türü (etiketler olasılık sırasındadır; ilk uygun etiket alınır)
    const posFromTags = (tags) => {
      const first = (tags || []).find(t => ['n', 'v', 'adj', 'adv'].includes(t));
      return { n: 'noun', v: 'verb', adj: 'adjective', adv: 'adverb' }[first] || 'noun';
    };
    // Metindeki kullanım biçimine göre tür: "assembled/introducing" → fiil, aksi halde Datamuse'un ilk etiketi
    const posFor = (lemma, forms, tags) => {
      const f = (forms || []).map(x => x.toLowerCase());
      if (f.some(x => x !== lemma && /(ed|ing)$/.test(x)) && (tags || []).includes('v')) return 'verb';
      return posFromTags(tags);
    };

    // Sıklık → seviye etiketi
    const freqLevel = (f) => f < 3 ? { label: 'İleri', cls: 'bg-purple-950 text-purple-300' } : f < 20 ? { label: 'Orta-İleri', cls: 'bg-blue-950 text-blue-300' } : { label: 'Orta', cls: 'bg-emerald-950 text-emerald-300' };

    // IPA → Türkçe harflerle okunuş (vurgulu hece BÜYÜK): /sɪɡˈnɪ.fɪ.kənt/ → sig-Nİ-fi-kınt
    const ipaToTurkish = (ipa) => {
      if (!ipa) return '';
      let s = ipa.split(',')[0].replace(/\([^)]*\)/g, '').replace(/[\/\[\]]/g, '').trim();   // (ɹ) gibi isteğe bağlı sesler atılır
      const map = [
        ['t͡ʃ', 'ç'], ['tʃ', 'ç'], ['d͡ʒ', 'c'], ['dʒ', 'c'], ['eɪ', 'ey'], ['aɪ', 'ay'], ['ɔɪ', 'oy'], ['aʊ', 'av'], ['əʊ', 'ou'], ['oʊ', 'ou'],
        ['ɪə', 'iı'], ['eə', 'eı'], ['ɛə', 'eı'], ['ʊə', 'uı'],
        ['iː', 'i'], ['uː', 'u'], ['ɑː', 'a'], ['ɔː', 'o'], ['ɜː', 'ö'], ['ɝ', 'ör'], ['ɚ', 'ır'],
        ['ɪ', 'i'], ['ʊ', 'u'], ['ə', 'ı'], ['ʌ', 'a'], ['æ', 'e'], ['ɑ', 'a'], ['ɒ', 'o'], ['ɔ', 'o'], ['ɛ', 'e'], ['ɜ', 'ö'], ['ɐ', 'a'], ['ᵻ', 'i'], ['ɨ', 'ı'],
        ['θ', 't'], ['ð', 'd'], ['ʃ', 'ş'], ['j', 'y'], ['ʒ', 'j'], ['ŋ', 'ng'], ['ɹ', 'r'], ['ɾ', 't'], ['ɡ', 'g'], ['ɫ', 'l'], ['ʔ', ''], ['ː', ''], ['̩', ''], ['ˌ', '.'],
      ];
      for (const [a, b] of map) s = s.split(a).join(b);
      s = s.replace(/ˈ/g, '·').replace(/[^a-zçğıöşüy·.]/g, '');
      const isV = (ch) => 'aeıioöuü'.includes(ch);
      const stressPos = s.replace(/\./g, '').indexOf('·');
      const letters = s.replace(/[·.]/g, '');
      if (!letters) return '';
      // Türkçe hece kuralları: V-CV, VC-CV
      const sylls = []; let cur = '';
      for (let i = 0; i < letters.length; i++) {
        cur += letters[i];
        if (!isV(letters[i])) continue;
        let j = i + 1; while (j < letters.length && !isV(letters[j])) j++;
        if (j >= letters.length) { cur += letters.slice(i + 1); break; }
        const cons = letters.slice(i + 1, j);
        if (cons.length <= 1) { sylls.push(cur); cur = ''; }
        else { const keep = cons.slice(0, cons.length - 1); cur += keep; sylls.push(cur); cur = ''; i += keep.length; }
      }
      if (cur) { if (sylls.length && !/[aeıioöuü]/.test(cur)) sylls[sylls.length - 1] += cur; else sylls.push(cur); }
      let stressed = -1;
      if (stressPos >= 0 && sylls.length > 1) {
        const firstV = letters.slice(stressPos).search(/[aeıioöuü]/) + stressPos;
        let pos = 0;
        for (let k = 0; k < sylls.length; k++) { if (firstV >= pos && firstV < pos + sylls[k].length) { stressed = k; break; } pos += sylls[k].length; }
      }
      return sylls.map((x, k) => k === stressed ? x.toLocaleUpperCase('tr') : x).join('-');
    };

    // Türkçe karşılıklar (MyMemory): birden çok anlam toplanır
    const fetchTurkish = async (word) => {
      const j = await fetchJson('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|tr');
      if (!j) return { meanings: [], quota: false };
      if (j.quotaFinished) return { meanings: [], quota: true };
      // Yalnızca kelimenin kendisiyle birebir eşleşen, makul kaliteli kayıtlar (cümle parçaları, ünlemli/garip girdiler elenir)
      const w = word.toLowerCase();
      const raw = [j.responseData && j.responseData.translatedText].concat(
        (j.matches || [])
          .filter(m => String(m.segment || '').trim().toLowerCase() === w)
          .filter(m => m.quality == null || +m.quality >= 60)
          .sort((a, b) => (+b.quality || 0) - (+a.quality || 0))
          .map(m => m.translation)
      );
      const seen = new Set(), meanings = [];
      raw.forEach(t => {
        if (!t) return;
        const v = String(t).trim().replace(/\.+$/, '').trim().toLocaleLowerCase('tr');
        if (!v || v === w || seen.has(v)) return;
        if (!/^[a-zçğıöşüâîû][a-zçğıöşüâîû' -]*[a-zçğıöşüâîû]$/i.test(v)) return;   // !, [ ], rakam, tek harf vb.
        if (v.split(/\s+/).length > 3) return;
        seen.add(v); meanings.push(v);
      });
      return { meanings: meanings.slice(0, 4), quota: false };
    };

    // Türkçe karşılıklar (Wiktionary, CC BY-SA): İngilizce Vikisözlük'teki "Translations" tablolarından, anlam başlığı ve türüyle.
    // Resmî MediaWiki API'si kullanılır (programla erişime izin verir).
    const cleanWikiItem = (s) => s
      .replace(/\{\{tt?\+?\|tr\|([^}|]+)[^}]*\}\}/g, '$1')
      .replace(/\{\{l\|tr\|([^}|]+)[^}]*\}\}/g, '$1')
      .replace(/\{\{[^}]*\}\}/g, '')
      .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2')
      .replace(/\[\[([^\]]+)\]\]/g, '$1')
      .replace(/\([^)]*\)/g, '')
      .replace(/['"’]/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    const parseWiktionaryTurkish = (wikitext) => {
      if (!wikitext) return { senses: [], subpage: false };
      const parts = wikitext.split(/\n==(?!=)/);
      const en = parts.find(s => /^\s*English\s*==/.test(s)) || (parts[0].startsWith('==English==') ? parts[0] : '');
      const senses = [];
      let pos = null, sense = null;
      en.split('\n').forEach(line => {
        const h = line.match(/^===+\s*(Noun|Verb|Adjective|Adverb|Proper noun)\s*=+/);
        if (h) pos = h[1].toLowerCase();
        const tt = line.match(/\{\{trans-top(?:-also)?\|([^}|]*)/);
        if (tt) sense = tt[1].trim();
        else if (/\{\{trans-top\}\}/.test(line)) sense = '';
        if (/^\*\s*Turkish\s*:/.test(line)) {
          const body = line.replace(/^\*\s*Turkish\s*:/, '');
          const words = body.replace(/\{\{[^}]*\}\}/g, m => /^\{\{(tt?\+?|l)\|tr\|/.test(m) ? cleanWikiItem(m) + ',' : '')
            .split(/[,;]/).map(cleanWikiItem).filter(w => w && /^[a-zçğıöşüâîû][a-zçğıöşüâîû ' -]*$/i.test(w) && w.split(' ').length <= 4);
          if (words.length) senses.push({ pos, sense, words: [...new Set(words)] });
        }
      });
      return { senses, subpage: /\{\{see translation subpage/.test(en) };
    };

    const fetchWikiText = async (page) => {
      const j = await fetchJson('https://en.wiktionary.org/w/api.php?action=parse&page=' + encodeURIComponent(page) + '&prop=wikitext&format=json&formatversion=2&redirects=1&origin=*');
      return j && j.parse ? j.parse.wikitext : null;
    };

    const fetchWiktionaryTurkish = async (word, wantPos) => {
      let { senses, subpage } = parseWiktionaryTurkish(await fetchWikiText(word));
      if (subpage) {
        const sub = parseWiktionaryTurkish('==English==\n' + ((await fetchWikiText(word + '/translations').catch(() => null)) || ''));
        senses = senses.concat(sub.senses);
      }
      if (!senses.length) return { meanings: [], senses: [] };
      // İstenen türdeki anlamlar önce; en fazla 5 karşılık
      const ordered = [...senses.filter(s => s.pos === wantPos), ...senses.filter(s => s.pos !== wantPos)];
      const meanings = [];
      ordered.forEach(s => s.words.forEach(w => { if (meanings.length < 5 && !meanings.includes(w)) meanings.push(w); }));
      return { meanings, senses: ordered.slice(0, 4) };
    };

    // Önce Wiktionary, bulunamazsa MyMemory
    const fetchTurkishAuto = async (word, wantPos) => {
      try {
        const wk = await fetchWiktionaryTurkish(word, wantPos);
        if (wk.meanings.length) return { meanings: wk.meanings, senses: wk.senses, source: 'Wiktionary', quota: false };
      } catch (e) {}
      const mm = await fetchTurkish(word).catch(() => ({ meanings: [], quota: false }));
      return { meanings: mm.meanings, senses: [], source: mm.meanings.length ? 'MyMemory' : '', quota: mm.quota };
    };

    // Bir kelimenin tüm ayrıntıları: Türkçe anlam, IPA, okunuş, ses, tanım, örnekler, eş/zıt anlamlılar
    const dictCache = cacheGet(CACHE_KEYS.DICT);
    const fetchWordDetails = async (lemma, wantPos) => {
      const key = lemma + '|' + wantPos;
      if (dictCache[key]) return dictCache[key];
      const [dict, syn, ant, tr] = await Promise.all([
        fetchJson('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lemma)).catch(() => null),
        fetchJson('https://api.datamuse.com/words?rel_syn=' + encodeURIComponent(lemma) + '&max=8').catch(() => []),
        fetchJson('https://api.datamuse.com/words?rel_ant=' + encodeURIComponent(lemma) + '&max=6').catch(() => []),
        fetchTurkishAuto(lemma, wantPos).catch(() => ({ meanings: [], senses: [], source: '', quota: false })),
      ]);
      const entries = Array.isArray(dict) ? dict : [];
      const phonetics = entries.flatMap(e => e.phonetics || []);
      let ipa = (entries.find(e => e.phonetic) || {}).phonetic || (phonetics.find(p => p.text) || {}).text || '';
      if (!ipa) {
        // Yedek: Datamuse telaffuz verisi (IPA)
        const pr = await fetchJson('https://api.datamuse.com/words?sp=' + encodeURIComponent(lemma) + '&md=r&ipa=1&max=1').catch(() => null);
        const tag = pr && pr[0] && (pr[0].tags || []).find(t => t.startsWith('ipa_pron:'));
        if (tag) ipa = tag.slice(9);
      }
      const audioUrl = (phonetics.find(p => p.audio && /-us\./.test(p.audio)) || phonetics.find(p => p.audio) || {}).audio || '';
      const meanings = entries.flatMap(e => e.meanings || []);
      const main = meanings.find(m => m.partOfSpeech === wantPos) || meanings[0];
      const pos = wantPos || (main && main.partOfSpeech) || 'noun';
      const defs = main ? (main.definitions || []) : [];
      const examples = meanings.flatMap(m => (m.definitions || []).map(d => d.example)).filter(Boolean).slice(0, 2);
      const uniq = (arr, n) => [...new Set(arr.map(x => String(x).trim().toLowerCase()).filter(x => x && x !== lemma))].slice(0, n);
      const synonyms = uniq([
        ...meanings.flatMap(m => (m.synonyms || []).concat((m.definitions || []).flatMap(d => d.synonyms || []))),
        ...(syn || []).map(x => x.word),
      ], 6);
      const antonyms = uniq([
        ...meanings.flatMap(m => (m.antonyms || []).concat((m.definitions || []).flatMap(d => d.antonyms || []))),
        ...(ant || []).map(x => x.word),
      ], 5);
      const details = {
        turkish: tr.meanings.join(', '),
        trSenses: tr.senses || [],
        trSource: tr.source || '',
        trQuota: tr.quota,
        ipa: ipa.replace(/^\/|\/$/g, ''),
        okunus: ipaToTurkish(ipa),
        audioUrl,
        partOfSpeech: pos,
        definition: defs.slice(0, 2).map(d => d.definition).join(' / '),
        examples,
        synonyms,
        antonyms,
      };
      if (!tr.quota) { dictCache[key] = details; cacheSet(CACHE_KEYS.DICT, dictCache); }
      return details;
    };

    // Tureng: kullanım koşulları otomatik veri çekmeyi yasakladığı için yalnızca kelime sayfasına bağlantı verilir
    // (kullanıcı sayfayı kendisi açar, anlamı kendisi kopyalar)
    const turengUrl = (word) => 'https://tureng.com/tr/turkce-ingilizce/' + encodeURIComponent(String(word || '').trim().toLowerCase());
    const TurengLink = ({ word, className }) => (
      <a
        href={turengUrl(word)}
        target="_blank"
        rel="noopener noreferrer"
        onClick={e => e.stopPropagation()}
        title={'"' + word + '" kelimesini Tureng\'de aç (yeni sekme)'}
        className={"inline-flex items-center gap-1 px-2 py-1 rounded-md bg-red-950/60 border border-red-900 text-[10px] font-bold text-red-300 hover:bg-red-900 hover:text-white transition " + (className || '')}
      >
        Tureng ↗
      </a>
    );
    const isMissingMeaning = (c) => !c.turkish || /^\(anlam bulunamadı/.test(c.turkish);

    const playWord = (card) => {
      if (card.audioUrl) {
        const a = new Audio(card.audioUrl);
        a.play().catch(() => speakText(card.english));
      } else speakText(card.english);
    };

    // --- BULUT SENKRONİZASYONU (Firebase) ---
    // Web yapılandırması gizli değildir (her Firebase web uygulamasında herkese açıktır).
    // Erişimi Firestore güvenlik kuralları korur: her kullanıcı yalnızca users/{kendi uid}/... altını okuyup yazabilir.
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyCKJsQfCTh2wtOZ5t0HcOMHf4fC1ua0VDs',
      authDomain: 'yokdil-master.firebaseapp.com',
      projectId: 'yokdil-master',
      storageBucket: 'yokdil-master.firebasestorage.app',
      messagingSenderId: '294443630442',
      appId: '1:294443630442:web:7ef2849a41c5d6e4b72f13',
    };
    // Eşitlenen veri türleri (Ayarlar bilerek dahil değil: Telegram token'ı gibi gizli bilgiler buluta gitmez)
    const SYNC_KINDS = ['weeks', 'readings', 'cards', 'activity'];
    const SYNC_TS_KEY = 'yokdil_sync_ts_v1';            // { kind: { id: son yerel değişiklik zamanı } }
    // Firestore'da bir belge en fazla 1 MB olabilir; daha büyük öğe toplu gönderimi tümden bozar → atlanır (cihazda kalır)
    const SYNC_MAX_BYTES = 900000;

    let fbCache = null;
    const getFirebase = () => {
      if (!window.firebase) return null;
      if (!fbCache) {
        try {
          if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
          const db = firebase.firestore();
          try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}   // çevrimdışı çalışma
          fbCache = { auth: firebase.auth(), db };
        } catch (e) { console.warn('Firebase başlatılamadı', e); return null; }
      }
      return fbCache;
    };

    // Firestore'da her öğe tek belge: users/{uid}/{kind}/{id} = { json, ts, deleted }
    // (json olarak saklanır: undefined/iç içe alanlar sorun çıkarmaz; silinenler "deleted" işaretiyle tutulur ki diğer cihazlar da silsin)
    function useCloudSync({ weeks, setWeeks, readings, setReadings, cards, setCards, activity, setActivity }) {
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [status, setStatus] = useState('off');      // off | syncing | synced | error
      const [error, setError] = useState('');
      const [lastSync, setLastSync] = useState(null);
      const [tooBig, setTooBig] = useState([]);          // buluta sığmadığı için yalnızca bu cihazda kalan öğeler
      const data = { weeks, readings, cards, activity };
      const setters = { weeks: setWeeks, readings: setReadings, cards: setCards, activity: setActivity };
      const dataRef = useRef(data); dataRef.current = data;
      const synced = useRef({ weeks: new Map(), readings: new Map(), cards: new Map(), activity: new Map() });   // buluttaki bilinen hâl (id → json)
      const ready = useRef(false);
      const seen = useRef(null);                         // değişiklik zamanı damgası için önceki yerel hâl

      const toMap = (list) => new Map((list || []).filter(x => x && x.id != null).map(x => [String(x.id), JSON.stringify(x)]));
      const tsAll = () => { try { return JSON.parse(localStorage.getItem(SYNC_TS_KEY) || '{}'); } catch (e) { return {}; } };

      // Yerel değişikliklere zaman damgası (giriş yapılmamışken de): ilk girişte hangi sürümün yeni olduğunu bilmek için
      useEffect(() => {
        const cur = { weeks: toMap(weeks), readings: toMap(readings), cards: toMap(cards), activity: toMap(activity) };
        if (seen.current) {
          const all = tsAll(); const now = Date.now(); let changed = false;
          SYNC_KINDS.forEach(k => {
            all[k] = all[k] || {};
            cur[k].forEach((j, id) => { if (seen.current[k].get(id) !== j) { all[k][id] = now; changed = true; } });
          });
          if (changed) { try { localStorage.setItem(SYNC_TS_KEY, JSON.stringify(all)); } catch (e) {} }
        }
        seen.current = cur;
      }, [weeks, readings, cards, activity]);

      // Oturum durumu
      useEffect(() => {
        const fb = getFirebase();
        if (!fb) { setAuthReady(true); return; }
        fb.auth.getRedirectResult().catch(e => setError(authErrorText(e)));
        return fb.auth.onAuthStateChanged(u => { setUser(u); setAuthReady(true); });
      }, []);

      // Girişte: birleştir + canlı dinle
      useEffect(() => {
        if (!user) { ready.current = false; setStatus('off'); return; }
        const fb = getFirebase();
        const unsubs = [];
        let cancelled = false;
        (async () => {
          setStatus('syncing'); setError('');
          try {
            const tsMap = tsAll();
            for (const kind of SYNC_KINDS) {
              const col = fb.db.collection('users').doc(user.uid).collection(kind);
              const snap = await col.get();
              if (cancelled) return;
              const remote = new Map();
              snap.forEach(d => remote.set(d.id, d.data()));
              const local = dataRef.current[kind] || [];
              const localIds = new Set(local.map(x => String(x.id)));
              const uploads = [];
              const remoteOnly = [];
              const merged = [];
              local.forEach(l => {
                const id = String(l.id), r = remote.get(id), lj = JSON.stringify(l);
                if (!r) { merged.push(l); uploads.push([id, lj]); return; }                  // yalnızca bu cihazda → yükle
                if (r.deleted) {                                                              // başka cihazda silinmiş
                  if ((tsMap[kind] || {})[id] > (r.ts || 0)) { merged.push(l); uploads.push([id, lj]); }
                  return;
                }
                if (r.json === lj) { merged.push(l); return; }
                if ((tsMap[kind] || {})[id] > (r.ts || 0)) { merged.push(l); uploads.push([id, lj]); }  // yerel daha yeni
                else merged.push(JSON.parse(r.json));                                          // bulut daha yeni
              });
              remote.forEach((r, id) => { if (!localIds.has(id) && !r.deleted && r.json) remoteOnly.push(JSON.parse(r.json)); });
              const final = [...remoteOnly, ...merged];

              const okUploads = uploads.filter(([, json]) => json.length <= SYNC_MAX_BYTES);
              if (okUploads.length < uploads.length) setTooBig(prev => [...new Set([...prev, ...uploads.filter(([, j]) => j.length > SYNC_MAX_BYTES).map(([id]) => id)])]);
              for (let i = 0; i < okUploads.length; i += 400) {
                const batch = fb.db.batch();
                okUploads.slice(i, i + 400).forEach(([id, json]) => batch.set(col.doc(id), { json, ts: Date.now(), deleted: false }));
                await batch.commit();
              }
              synced.current[kind] = toMap(final);
              seen.current = { ...(seen.current || {}), [kind]: toMap(final) };
              setters[kind](final);

              // Diğer cihazlardan gelen değişiklikleri canlı uygula
              unsubs.push(col.onSnapshot(s => {
                if (s.metadata.hasPendingWrites) return;
                const changes = s.docChanges();
                if (!changes.length) return;
                setters[kind](prev => {
                  let next = prev;
                  changes.forEach(ch => {
                    const id = ch.doc.id, r = ch.doc.data();
                    const gone = ch.type === 'removed' || r.deleted;
                    if (gone) {
                      if (next.some(x => String(x.id) === id)) next = next.filter(x => String(x.id) !== id);
                      synced.current[kind].delete(id);
                      return;
                    }
                    if (synced.current[kind].get(id) === r.json) return;
                    synced.current[kind].set(id, r.json);
                    const item = JSON.parse(r.json);
                    const idx = next.findIndex(x => String(x.id) === id);
                    next = idx >= 0 ? next.map((x, i) => i === idx ? item : x) : [item, ...next];
                  });
                  return next;
                });
                setLastSync(new Date());
              }, e => { setError('Canlı eşitleme hatası: ' + e.message); setStatus('error'); }));
            }
            if (cancelled) return;
            ready.current = true;
            setStatus('synced'); setLastSync(new Date());
          } catch (e) {
            if (cancelled) return;
            setError('Eşitleme hatası: ' + (e && e.message ? e.message : e)); setStatus('error');
          }
        })();
        return () => { cancelled = true; ready.current = false; unsubs.forEach(u => u()); };
      }, [user]);

      // Yerel değişiklikleri buluta gönder (1,2 sn gecikmeyle toplu)
      useEffect(() => {
        if (!user || !ready.current) return;
        const t = setTimeout(async () => {
          const fb = getFirebase(); if (!fb) return;
          const ops = [], big = [];
          SYNC_KINDS.forEach(kind => {
            const cur = toMap(dataRef.current[kind]);
            const prev = synced.current[kind];
            cur.forEach((json, id) => {
              if (prev.get(id) === json) return;
              if (json.length > SYNC_MAX_BYTES) { big.push(id); return; }   // çok büyük: buluta gönderilmez
              ops.push([kind, id, json]);
            });
            prev.forEach((_, id) => { if (!cur.has(id)) ops.push([kind, id, null]); });
          });
          if (big.length) setTooBig(prevB => [...new Set([...prevB, ...big])]);
          if (!ops.length) return;
          setStatus('syncing');
          try {
            for (let i = 0; i < ops.length; i += 400) {
              const batch = fb.db.batch();
              ops.slice(i, i + 400).forEach(([kind, id, json]) => {
                const ref = fb.db.collection('users').doc(user.uid).collection(kind).doc(id);
                batch.set(ref, json === null ? { json: '', ts: Date.now(), deleted: true } : { json, ts: Date.now(), deleted: false });
              });
              await batch.commit();
            }
            ops.forEach(([kind, id, json]) => { json === null ? synced.current[kind].delete(id) : synced.current[kind].set(id, json); });
            setStatus('synced'); setLastSync(new Date()); setError('');
          } catch (e) {
            setError('Gönderilemedi: ' + (e && e.message ? e.message : e)); setStatus('error');
          }
        }, 1200);
        return () => clearTimeout(t);
      }, [weeks, readings, cards, activity, user]);

      const signIn = async () => {
        const fb = getFirebase();
        if (!fb) { setError('Firebase yüklenemedi (internet bağlantısını kontrol edin).'); return; }
        setError('');
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try { await fb.auth.signInWithPopup(provider); }
        catch (e) {
          if (e && /popup-blocked|operation-not-supported/.test(e.code || '')) { try { await fb.auth.signInWithRedirect(provider); } catch (e2) { setError(authErrorText(e2)); } }
          else if (!(e && /popup-closed|cancelled-popup/.test(e.code || ''))) setError(authErrorText(e));
        }
      };
      const signOut = async () => { const fb = getFirebase(); if (fb) await fb.auth.signOut(); };

      return { user, authReady, status, error, lastSync, signIn, signOut, available: !!window.firebase, tooBig };
    }

    const authErrorText = (e) => {
      const c = (e && e.code) || '';
      if (/unauthorized-domain/.test(c)) return 'Bu adres Firebase\'de izinli değil (Authentication → Settings → Authorized domains).';
      if (/network/.test(c)) return 'Bağlantı hatası; internetinizi kontrol edin.';
      return 'Giriş yapılamadı: ' + ((e && e.message) || c || 'bilinmeyen hata');
    };

    // Yedek indir / yükle: farklı adreslerde (localhost, dosya, github.io) tutulan verileri taşımak için
    function BackupLinks({ onExport, onImport }) {
      const inputRef = useRef(null);
      return (
        <div className="flex items-center gap-2 pt-1 border-t border-slate-800 mt-1">
          <button onClick={onExport} className="text-[10px] text-blue-400 hover:text-blue-300 underline" title="Tüm haftaları, metinleri ve kartları bir dosyaya indir">⬇ Yedek indir</button>
          <button onClick={() => inputRef.current && inputRef.current.click()} className="text-[10px] text-blue-400 hover:text-blue-300 underline" title="Daha önce indirdiğiniz yedek dosyasını ekle (mevcut veriler silinmez)">⬆ Yedek yükle</button>
          <input ref={inputRef} type="file" accept=".json,application/json" className="hidden" onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) onImport(f); }} />
        </div>
      );
    }

    function SyncPanel({ sync, backup }) {
      const links = backup ? <BackupLinks onExport={backup.onExport} onImport={backup.onImport} /> : null;
      if (!sync.available) {
        return <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-[11px] text-slate-400">☁️ Bulut eşitleme yüklenemedi (internet bağlantısı gerekli).{links}</div>;
      }
      if (!sync.authReady) return <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-[11px] text-slate-500">☁️ Kontrol ediliyor…{links}</div>;
      if (!sync.user) {
        return (
          <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-[11px] text-slate-400 space-y-2">
            <p><span className="font-bold text-slate-200">☁️ Cihazlar arası eşitleme</span><br />Giriş yapınca kelimeleriniz, metinleriniz ve kartlarınız tüm cihazlarınızda aynı olur.</p>
            <button onClick={sync.signIn} className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-white text-slate-800 text-xs font-bold hover:bg-slate-100">
              <svg width="14" height="14" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
              Google ile giriş yap
            </button>
            {sync.error && <p className="text-red-400">{sync.error}</p>}
            {links}
          </div>
        );
      }
      const label = { syncing: '⟳ Eşitleniyor…', synced: '✓ Eşitlendi' + (sync.lastSync ? ' · ' + sync.lastSync.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : ''), error: '⚠ Eşitleme sorunu', off: '' }[sync.status];
      const cls = { syncing: 'text-blue-300', synced: 'text-emerald-400', error: 'text-red-400', off: 'text-slate-500' }[sync.status];
      return (
        <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-[11px] text-slate-400 space-y-1.5">
          <div className="flex items-center gap-2">
            {sync.user.photoURL
              ? <img src={sync.user.photoURL} alt="" referrerPolicy="no-referrer" className="w-6 h-6 rounded-full" />
              : <span className="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">{(sync.user.email || '?')[0].toUpperCase()}</span>}
            <span className="truncate text-slate-200 font-semibold" title={sync.user.email}>{sync.user.displayName || sync.user.email}</span>
          </div>
          <p role="status" className={cls}>☁️ {label}</p>
          {sync.error && <p className="text-red-400">{sync.error}</p>}
          {(sync.tooBig || []).length > 0 && <p className="text-amber-400">{sync.tooBig.length} çok uzun metin buluta sığmadığı için yalnızca bu cihazda saklanıyor.</p>}
          <button onClick={sync.signOut} className="text-[10px] text-slate-500 hover:text-slate-300 underline">Çıkış yap (veriler bu cihazda kalır)</button>
          {links}
        </div>
      );
    }

    // --- ANA UYGULAMA BİLEŞENİ ---
    function App({ initial, storageMode }) {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [weeks, setWeeks] = useState(() => initial[STORAGE_KEYS.WEEKS] || []);
      const [readings, setReadings] = useState(() => initial[STORAGE_KEYS.READINGS] || []);
      const [cards, setCards] = useState(() => initial[STORAGE_KEYS.VOCAB] || []);
      const [storageWarning, setStorageWarning] = useState('');
      const [activity, setActivity] = useState(() => initial[STORAGE_KEYS.ACTIVITY] || []);
      // Bulut eşitleme (Google ile giriş yapılınca haftalar, metinler, kartlar ve çalışma kaydı tüm cihazlarda aynı olur)
      const sync = useCloudSync({ weeks, setWeeks, readings, setReadings, cards, setCards, activity, setActivity });

      // Günlük çalışma kaydına ekle: logActivity({ reviews: 1, correct: 1 })
      const logActivity = (patch, byType) => {
        const day = getTodayStr();
        setActivity(prev => {
          const cur = prev.find(a => a.id === day) || { id: day, reviews: 0, correct: 0, again: 0, newCards: 0, examQ: 0, examCorrect: 0, examByType: {} };
          const next = { ...cur };
          Object.entries(patch).forEach(([k, v]) => { next[k] = (next[k] || 0) + v; });
          if (byType) {
            next.examByType = { ...(cur.examByType || {}) };
            Object.entries(byType).forEach(([t, [c, n]]) => {
              const p = next.examByType[t] || [0, 0];
              next.examByType[t] = [p[0] + c, p[1] + n];
            });
          }
          return [next, ...prev.filter(a => a.id !== day)].slice(0, 400);
        });
      };

      // --- Yedek indir / yükle ---
      const exportBackup = () => {
        const payload = { app: 'yokdil-master', version: 1, exportedAt: new Date().toISOString(), weeks, readings, cards };
        const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'yokdil-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showToast('Yedek indirildi: ' + weeks.length + ' hafta, ' + readings.length + ' metin, ' + cards.length + ' kart.');
      };

      // Yedekteki öğeler mevcutlarla birleştirilir (hiçbir şey silinmez); aynı öğe varsa daha yeni olan kalır
      const importBackup = async (file) => {
        try {
          const data = JSON.parse(await file.text());
          if (!data || (data.app && data.app !== 'yokdil-master') || !Array.isArray(data.cards || []) ) throw new Error('Bu dosya bir YÖKDİL Master yedeği değil.');
          const stamp = (x) => Date.parse(x.updatedAt || x.createdAt || x.dateAdded || 0) || 0;
          const mergeList = (cur, inc) => {
            const map = new Map(cur.map(x => [String(x.id), x]));
            let added = 0, updated = 0;
            (inc || []).filter(x => x && x.id != null).forEach(x => {
              const id = String(x.id), ex = map.get(id);
              if (!ex) { map.set(id, x); added++; }
              else if (stamp(x) > stamp(ex) && JSON.stringify(x) !== JSON.stringify(ex)) { map.set(id, x); updated++; }
            });
            const incIds = new Set((inc || []).map(x => String(x.id)));
            const newOnes = (inc || []).filter(x => x && !cur.some(c => String(c.id) === String(x.id)));
            const rest = cur.map(c => map.get(String(c.id)));
            return { list: [...newOnes, ...rest], added, updated, incIds };
          };
          const w = mergeList(weeks, data.weeks), r = mergeList(readings, data.readings), c = mergeList(cards, data.cards);
          setWeeks(w.list); setReadings(r.list); setCards(c.list);
          showToast('Yedek yüklendi: ' + w.added + ' hafta, ' + r.added + ' metin, ' + c.added + ' kart eklendi' + ((w.updated + r.updated + c.updated) ? ', ' + (w.updated + r.updated + c.updated) + ' öğe güncellendi' : '') + (sync.user ? '. Buluta eşitleniyor…' : '.'));
        } catch (e) {
          showToast('Yedek yüklenemedi: ' + (e instanceof SyntaxError ? 'dosya geçerli bir yedek değil.' : (e && e.message ? e.message : 'dosya okunamadı')), true);
        }
      };
      const [settings, setSettings] = useState(() => initial[STORAGE_KEYS.SETTINGS] || ({
        theme: 'dark',
        notificationTime: '20:00',
        telegramEnabled: false,
        telegramBotToken: '',
        telegramChatId: '',
        appUrl: window.location.href,
        cloudProvider: 'none'
      }));

      // Kalıcı kayıt (IndexedDB; olmazsa localStorage). Kayıt başarısız olursa sessiz kalmaz, uyarı gösterir.
      const persist = (key, val) => {
        persistKey(storageMode, key, val).then(err => {
          if (!err) return;
          setStorageWarning(isQuotaError(err)
            ? 'Depolama alanı doldu; son değişiklikler bu cihaza kaydedilemedi. "⬇ Yedek indir" ile yedek alın ve kullanılmayan uzun metinleri silin.'
            : 'Veriler kaydedilemedi: ' + (err.message || err) + '. "⬇ Yedek indir" ile yedek almanız önerilir.');
        });
      };

      // Modallar ve Detay Durumları
      const [selectedWeekId, setSelectedWeekId] = useState(null);
      const [selectedReadingId, setSelectedReadingId] = useState(null);
      const [isVocabModalOpen, setIsVocabModalOpen] = useState(false);
      const [editingCard, setEditingCard] = useState(null);
      const [initialWord, setInitialWord] = useState('');
      const [initialSentence, setInitialSentence] = useState('');
      const [isNewWeekOpen, setIsNewWeekOpen] = useState(false);
      const [isUploadReadingOpen, setIsUploadReadingOpen] = useState(false);
      const [isUploadExamOpen, setIsUploadExamOpen] = useState(false);
      const [customExams, setCustomExams] = useState(() => getStored('custom_exams', []));
      const [autoVocabReadingId, setAutoVocabReadingId] = useState(null);
      const [recentCardIds, setRecentCardIds] = useState([]);
      const [toast, setToast] = useState('');
      const showToast = (msg, isError) => { setToast((isError ? '⚠ ' : '') + msg); setTimeout(() => setToast(''), 6000); };
      const [duplicateCard, setDuplicateCard] = useState(null);

      useEffect(() => {
        setStored('custom_exams', customExams);
      }, [customExams]);

      const handleExtractVocabFromExam = (exam) => {
        const vocabQs = exam.questions.filter(q => q.num <= 6 || q.category.includes('Kelime'));
        if (!vocabQs.length) {
          showToast('Bu sınavda ayrıştırılmış kelime sorusu bulunamadı.', true);
          return;
        }
        const existingWords = new Set(cards.map(c => String(c.lemma || c.english).toLowerCase()));
        const newCards = [];
        const now = new Date().toISOString();

        vocabQs.forEach(q => {
          q.options.forEach((opt, idx) => {
            const clean = opt.trim().toLowerCase().replace(/[^a-z\s-]/g, '');
            if (clean.length >= 3 && !existingWords.has(clean) && !STOPWORDS.has(clean)) {
              existingWords.add(clean);
              const isCorrect = q.answer === idx;
              const cardId = 'card_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
              newCards.push({
                id: cardId,
                english: opt.trim(),
                lemma: clean,
                turkish: '(çıkmış sınav kelimesi)',
                partOfSpeech: clean.endsWith('ly') ? 'adverb' : clean.endsWith('tion') ? 'noun' : 'verb',
                originalSentence: isCorrect ? q.prompt.replace(/----/g, opt.trim()) : q.prompt,
                questionType: 'Kelime Soruları (Soru 1-6)',
                sourceType: 'verified_exam',
                examInfo: {
                  year: exam.year,
                  term: exam.term,
                  field: exam.field,
                  verified: true
                },
                isDifficult: false,
                srs: createSRS(cardId),
                createdAt: now,
                updatedAt: now
              });
            }
          });
        });

        if (newCards.length > 0) {
          setCards([...newCards, ...cards]);

      // Metin Seçimi ve Popover
      const [selectionText, setSelectionText] = useState('');

      const [expandedPhrase, setExpandedPhrase] = useState('');

      // --- Tıkla-anlam: okuma ekranında tek tıkla kelimenin anlamı ---

      const [awlHighlight, setAwlHighlight] = useState(false);
      const [sentenceToAnalyze, setSentenceToAnalyze] = useState(null);
      const [audioOpen, setAudioOpen] = useState(false);
      const [moreOpen, setMoreOpen] = useState(false);
      const [examPreset, setExamPreset] = useState(null);   // { weekly: true } → Sınav sekmesinde haftalık check-up başlat
      const handleWordClick = (e, reading) => {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.toString().trim().length > 1) return;   // seçim yapılıyorsa eski akış
        let node = null, offset = 0;
        if (document.caretRangeFromPoint) {
          const r = document.caretRangeFromPoint(e.clientX, e.clientY);
          if (r) { node = r.startContainer; offset = r.startOffset; }
        } else if (document.caretPositionFromPoint) {
          const p = document.caretPositionFromPoint(e.clientX, e.clientY);
          if (p) { node = p.offsetNode; offset = p.offset; }
        }
        if (!node || node.nodeType !== 3) { setWordPop(null); return; }
        const text = node.textContent;
        const isW = (ch) => /[A-Za-z'’-]/.test(ch || '');
        let s = offset, en = offset;
        while (s > 0 && isW(text[s - 1])) s--;
        while (en < text.length && isW(text[en])) en++;
        while (s < en && /['’-]/.test(text[s])) s++;
        while (en > s && /['’-]/.test(text[en - 1])) en--;
        let word = text.slice(s, en);
        if (/['’]s$/i.test(word)) { word = word.slice(0, -2); en -= 2; }
        if (word.length < 2 || !/[A-Za-z]{2}/.test(word)) { setWordPop(null); return; }
        const range = document.createRange();
        range.setStart(node, s); range.setEnd(node, en);
        const rect = range.getBoundingClientRect();
        if (!rect || (rect.left === 0 && rect.top === 0)) return;
        setPopoverPos(null);
        setWordPop({
          word,
          sentence: extractSentence(reading.content.replace(/^##\s+/gm, ''), word),
          x: rect.left + rect.width / 2, y: rect.bottom, top: rect.top,
          readingId: reading.id,
        });
      };

      // Anlam kutusundan karta ekle (bankada varsa yeni kaynak cümle eklenir)
      const addWordFromPopover = (info, pop) => {
        const reading = readings.find(r => r.id === pop.readingId);
        const now = new Date().toISOString();
        const lemma = (info.lemma || pop.word).toLowerCase();
        const source = { readingId: reading ? reading.id : '', readingTitle: reading ? reading.title : '', weekId: reading ? reading.weekId : '', sentence: pop.sentence, dateAdded: now };
        const existing = cards.find(c => String(c.lemma || c.english).toLowerCase() === lemma);
        if (existing) {
          setCards(cards.map(c => c.id === existing.id ? { ...c, sources: [...(c.sources || []), source], updatedAt: now } : c));
          showToast('"' + lemma + '" zaten bankada; yeni cümle eklendi.');
        } else {
          const id = 'card_' + Date.now();
          setCards([{

      useEffect(() => {

          try {
            if (navigator.storage && navigator.storage.estimate) {

            }

          const smartExp = findSmartCollocation(sentence, text);
          setExpandedPhrase(smartExp && smartExp.toLowerCase() !== text.toLowerCase() ? smartExp : '');
          setPopoverPos({ top: rect.top, left: rect.left + rect.width / 2 });

                        {(() => {

                          (plainText(current.content).match(/[A-Za-z]+/g) || []).forEach(t => {
                            const w = t.toLowerCase();
                            if (w.length < 3 || seen.has(w) || STOPWORDS.has(w)) return;
                            const n = awlSublist(w);
                            if (n) seen.set(w, n);
                          });
                          const list = [...seen.entries()].sort((a, b) => a[1] - b[1]);
                          if (!list.length) return null;
                          const missing = list.filter(([w]) => !inBank(w));
                          return (
                            <div className="bg-slate-950 p-4 rounded-2xl border border-purple-900/50 space-y-2">
                              <div className="flex flex-wrap items-center gap-2">
                                <p className="text-xs text-purple-200 font-bold mr-auto">📚 Bu metinde {list.length} akademik kelime (AWL) var{missing.length ? ', ' + missing.length + ' tanesi bankanızda yok' : ' — hepsi bankanızda ✓'}</p>
                                <label className="flex items-center gap-1.5 text-[11px] text-slate-400 cursor-pointer select-none">
                                  <input type="checkbox" checked={awlHighlight} onChange={e => setAwlHighlight(e.target.checked)} className="accent-purple-500" />

                                </label>
                              </div>
                              <div className="flex flex-wrap gap-1">
                                {list.slice(0, 80).map(([w, n]) => (
                                  <button key={w}

                                    title={'Alt liste ' + n + (inBank(w) ? ' · bankada var' : ' · anlamını gör / karta ekle')}
                                    className={"px-2 py-0.5 rounded-full text-[11px] border " + (inBank(w) ? 'border-emerald-800 text-emerald-300 bg-emerald-950/40' : 'border-purple-800 text-purple-200 bg-purple-950/40 hover:bg-purple-900')}>
                                    {w}<sup className="ml-0.5 text-[8px] opacity-70">{n}</sup>
                                  </button>

                              </div>
                            </div>

                            // AWL vurgusu (çok uzun metinlerde performans için kapalı)
                            const hl = awlHighlight && current.content.length < 120000;
                            const bank = hl ? new Set(cards.map(c => String(c.lemma || c.english).toLowerCase())) : null;
                            const renderLine = (line) => {
                              if (bionicReading) {
                                return line.split(/(\s+)/).map((tok, k) => {
                                  if (/^\s+$/.test(tok)) return tok;
                                  return formatBionicWord(tok, k);
                                });
                              }
                              if (!hl) return line;
                              return line.split(/([A-Za-z]+)/).map((tok, k) => {
                                if (k % 2 === 0) return tok;
                                const w = tok.toLowerCase();
                                if (w.length < 3 || STOPWORDS.has(w) || !awlSublist(w)) return tok;
                                const own = bank.has(w) || lemmaCandidates(w).some(x => bank.has(x));
                                return <span key={k} className={"underline decoration-2 underline-offset-4 " + (own ? 'decoration-emerald-500/70' : 'decoration-purple-400')}>{tok}</span>;

                            };

                                : <React.Fragment key={i}>{renderLine(line)}{'\n'}</React.Fragment>

                            <p className="text-[11px] text-blue-400 font-bold mt-4">Aç ve Kelime Seç →</p>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                        const csvContent = "English,Turkish,IPA,Okunus,PartOfSpeech,Synonyms,Antonyms,OriginalSentence,Examples\n" +
                          cards.map(c => [c.english, c.turkish, c.ipa, c.okunus, c.partOfSpeech, c.synonyms, c.antonyms, c.originalSentence, c.examples].map(q).join(',')).join("\n");

                          const res = await fetch(`https://api.telegram.org/bot${settings.telegramBotToken}/sendMessage`, {
                            method: 'POST',

                              parse_mode: 'HTML'
                            })

                          if (d.ok) alert('Test bildirimi Telegram hesabınıza gönderildi!');

                setSelectedReadingId(null);

                setToast(newCards.length + ' yeni kelime kartı oluşturuldu' + (updated.length ? ', ' + updated.length + ' mevcut kart güncellendi' : '') + '.');
                setTimeout(() => setToast(''), 4000);
              }}
            />
          )}

          {storageWarning && (
            <div role="alert" className="fixed top-3 left-1/2 -translate-x-1/2 z-50 max-w-xl w-[92vw] px-4 py-3 rounded-xl bg-red-700 text-white text-xs font-semibold shadow-2xl flex items-start gap-3">
              <span className="flex-1">⚠ {storageWarning}</span>
              <button onClick={exportBackup} className="px-2 py-1 rounded bg-white text-red-700 font-bold whitespace-nowrap">Yedek indir</button>
              <button onClick={() => setStorageWarning('')} aria-label="Uyarıyı kapat" className="px-1 text-white/80 hover:text-white">✕</button>
            </div>
          )}

          {toast && (
            <div role="status" className={"fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-white text-xs font-bold shadow-2xl max-w-[90vw] " + (toast.startsWith('⚠') ? 'bg-red-600' : 'bg-emerald-600')}>
              {toast.startsWith('⚠') ? toast : '✓ ' + toast}
