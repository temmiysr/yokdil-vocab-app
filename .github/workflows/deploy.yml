name: Deploy to GitHub Pages

# Uygulamanın güncel sürümü dist/ klasöründedir (tek dosyalık dist/index.html).
# Yayından önce: ayrıştırıcı testleri çalışır (tests/parser.test.mjs), sonra scripts/build.mjs JSX kodunu
# önceden derleyip _site/ klasörüne yazar (tarayıcı Babel indirmez, site hızlı açılır). Yayınlanan: _site/.
# (src/ eski Vite kaynak kodudur.)
#
# Not: Ücretsiz GitHub hesabında GİZLİ (private) depodan Pages yayınlanamaz.
# Depo gizliyken bu iş push'ta kendiliğinden çalışmaz (hata e-postası gelmez).
# Depoyu herkese açık yaparsanız veya GitHub Pro kullanıyorsanız:
#   Settings → Pages → Source: "GitHub Actions" seçin; sonra Actions sekmesinden "Run workflow" ile çalıştırın.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Babel (build only)
        run: npm install --no-save --prefix /tmp/babel @babel/standalone@7.26.4

      - name: Run parser tests
        run: node tests/parser.test.mjs

      - name: Build (precompile JSX)
        run: BABEL_PATH=/tmp/babel/node_modules/@babel/standalone node scripts/build.mjs

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
