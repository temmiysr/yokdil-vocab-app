name: Telegram Daily Study Reminders

# Her gün iki hatırlatma (Türkiye saati = UTC+3):
#   Sabah 09:00 (06:00 UTC) → "Günün yeni kelimeleri"  (bağlantı uygulamayı ?go=learn ile açar)
#   Akşam 20:00 (17:00 UTC) → "Günün kelime sınavı"    (bağlantı uygulamayı ?go=quiz ile açar)
# GitHub Actions zamanlayıcısı yoğunlukta 5-25 dakika gecikebilir.
# Kurulum: depo Settings → Secrets and variables → Actions → TELEGRAM_BOT_TOKEN ve TELEGRAM_CHAT_ID.
# Secret'lar yoksa iş sessizce atlanır (hata e-postası gelmez). Ayrıntı: docs/TELEGRAM_BOT_KURULUMU.md

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Gönderilecek mesaj (sabah / aksam)'
        required: false
        default: 'sabah'

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ secrets.APP_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          KIND_INPUT: ${{ github.event.inputs.kind }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Bilgi: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID tanımlı değil; bildirim atlandı."
            exit 0
          fi
          BASE="${APP_URL:-https://temmiysr.github.io/yokdil-vocab-app/}"
          KIND="sabah"
          if [ "$SCHEDULE" = "0 17 * * *" ] || [ "$KIND_INPUT" = "aksam" ]; then KIND="aksam"; fi

          if [ "$KIND" = "sabah" ]; then
            TEXT=$'📘 <b>Günün yeni kelimeleri hazır!</b>\n\nÖnce öğretici kartlarla öğren: okunuş, anlam, örnek cümle. Akşam bu kelimelerden kısa bir sınav olacak.\n\n👉 <a href="'"${BASE}"'?go=learn">Yeni kelimeleri öğren</a>'
          else
            TEXT=$'🌙 <b>Günün kelime sınavı</b>\n\nBugün öğrendiğin kelimelerden kısa bir sınav seni bekliyor. Sonra da günlük tekrarlarını bitir.\n\n👉 <a href="'"${BASE}"'?go=quiz">Sınavı çöz</a>   ·   <a href="'"${BASE}"'?go=review">Tekrar</a>'
          fi

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true")

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Bildirim gönderildi ($KIND)."
          else
            echo "Bildirim gönderilemedi: $(echo "$RESPONSE" | sed 's/"description":"\([^"]*\)".*/\1/' | tail -c 200)"
            exit 1
          fi
